extends: existence
message: "Past-tense deletion history is Sediment (chronicler-docs-hygiene Phase 3). State current contract; don't narrate removal. See docs/AGENTS.md."
level: warning
ignorecase: true
tokens:
  - '\bused to be\b'
  - '\bused to (have|do|use|return|carry|mutate|trigger|fire|process|run)\b'
  - '\bpreviously (also|had|mutated|wired|returned|triggered|called|held|used)\b'
  - '\bpreviously (described|included|supported|known|replaced|carried|rendered|emitted|generated|fired|done|set|added|removed)\b'
  - '\bwas removed on\b'
  - '\bwas removed in\b'
  - '\bwas deleted (in|on|during)\b'
  - '\bdeleted in phase\b'
  - '\bolder revisions of\b'
  - '\bprevious version(s)? of this document\b'
  - '\bprevious (revisions|versions) of\b'
  - '\bin (phase|version) [0-9]+ we\b'
  - '\bno longer (wired|used|called|present|exists|exist|supported)\b'
  - '\bno longer (appear|disappear|show|display|expose|surface|propagate|create|return|include|apply|render|fire|emit|generate|output|affect|cover|handle|trigger|process|run|load|save|build|call|invoke|mutate)\b'
  - '\bformerly\b'
  - '\bhistorically\b'
  - '\bthinned out\b'
  - '\bReplaces (the )?(deleted|removed|old|former|previous|deprecated|legacy)\b'
  - '\breplaces (the )?(deleted|removed|old|former|previous|deprecated|legacy)\b'
  - '\breplaces ad-hoc\b'
  - '\bretained as (user-approved|narrow-case|survivors)\b'
  - '\bretained after\b'
