<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicler Engine</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
    <div class="error-notification" id="error-notification"></div>
    <div class="header" id="header" hx-get="/fragment/header" hx-trigger="load"></div>
    <div class="main-container">
        <div class="story-log" id="story-log" hx-get="/fragment/story-log" hx-trigger="load, every 2s" hx-swap="innerHTML" hx-on::after-swap="this.scrollTop = this.scrollHeight"></div>
        <div class="visual-sidebar" hx-get="/fragment/visual-sidebar" hx-trigger="load, every 5s"></div>
    </div>
    
    <!-- Static shell: form stays in DOM, never replaced -->
        <div class="action-area" id="action-area">
        <!-- Form targets hidden div, status updates via WS + JS -->
        <form id="command-form" 
              hx-post="/action" 
              hx-target="#status-display" 
              hx-swap="innerHTML" 
              hx-on::after-request="this.reset(); updateButtonState();">
            <input type="text" name="command" placeholder="Enter command..." required minlength="1" autocomplete="off" />
            <button type="submit" id="submit-btn"><span class="btn-icon">&#9654;</span> Send</button>
        </form>
        <div class="action-hints" id="action-hints" hx-get="/hints" hx-trigger="load, every 5s"></div>
        <div class="status ready" id="status-display" 
             hx-get="/status/generating" 
             hx-trigger="load, every 5s" 
             hx-swap="innerHTML"
             hx-on::after-swap="onStatusPoll(this)"><span class="status ready">Ready</span></div>
    </div>
    <script>
        console.log('[HTMX] Initializing...');
        
        // Button state management
        const submitBtn = document.getElementById('submit-btn');
        
        function setButtonState(isThinking) {
            if (isThinking) {
                submitBtn.innerHTML = '<span class="btn-icon">&#9632;</span> Stop';
                submitBtn.disabled = true;
            } else {
                submitBtn.innerHTML = '<span class="btn-icon">&#9654;</span> Send';
                submitBtn.disabled = false;
            }
        }
        
        // Called immediately when form is submitted (before server responds)
        function updateToThinking() {
            setButtonState(true);
            const statusDisplay = document.getElementById('status-display');
            if (statusDisplay) {
                statusDisplay.innerHTML = '<span class="status thinking">Thinking...</span>';
            }
        }
        
        // Called after form submission to disable button immediately
        // The server returns status and MutationObserver will re-enable it
        function updateButtonState() {
            setButtonState(true); // Immediately disable button on submit
        }
        
        // Called after HTMX polls /status/generating
        // The endpoint returns "generating" or "idle" (plain text)
        function onStatusPoll(el) {
            const text = el.textContent.trim();
            if (text === 'idle') {
                el.innerHTML = '<span class="status ready">Ready</span>';
                setButtonState(false);
            } else if (text === 'generating') {
                el.innerHTML = '<span class="status thinking">Thinking...</span>';
                setButtonState(true);
            }
            // If text is empty or unexpected, do nothing
        }
        
        // Watch status display for changes
        const statusDisplay = document.getElementById('status-display');
        const errorNotification = document.getElementById('error-notification');
        
        // Show error notification at top of screen
        function showError(message) {
            if (errorNotification) {
                errorNotification.textContent = message;
                errorNotification.classList.add('visible');
                // Auto-hide after 5 seconds
                setTimeout(() => {
                    errorNotification.classList.remove('visible');
                }, 5000);
            }
        }
        
        // Create a MutationObserver to watch for status changes
        const statusObserver = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'childList' || mutation.type === 'characterData') {
                    const statusText = statusDisplay.textContent;
                    // Re-enable button on ANY state that isn't thinking (Ready, Error, etc.)
                    if (statusText.includes('Thinking')) {
                        setButtonState(true);
                    } else {
                        setButtonState(false);
                    }
                    // Show error notification for error states
                    if (statusText.includes('Error')) {
                        showError(statusText);
                    }
                }
            });
        });
        
        // Start observing when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            statusObserver.observe(statusDisplay, { 
                childList: true, 
                characterData: true,
                subtree: true 
            });
            
            // Also check initial state
            if (statusDisplay.textContent.includes('Thinking')) {
                setButtonState(true);
            }
        });
        
        </script>
</body>
</html>
