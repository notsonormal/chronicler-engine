<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicler Engine</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10/dist/ext/sse.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0a; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
        
        /* Header */
        .header { background: #1a1a1a; border: 1px solid #333; padding: 8px 16px; display: flex; align-items: center; height: 48px; flex-shrink: 0; }
        .game-title { color: #888; }
        .location { color: #00ff00; font-weight: bold; }
        .connection-status { margin-left: auto; font-size: 11px; padding: 2px 8px; border-radius: 3px; }
        .connection-status.connected { color: #00ff00; background: rgba(0,255,0,0.1); }
        .connection-status.disconnected { color: #ff4444; background: rgba(255,68,68,0.1); }
        
        /* Main container */
        .main-container { display: flex; flex: 1; overflow: hidden; }
        
        /* Story log - now 80% */
        .story-log { 
            width: 80%; 
            background: #111; 
            border: 1px solid #333; 
            padding: 16px; 
            overflow-y: auto; 
        }
        
        /* Visual sidebar - now 20% */
        .visual-sidebar { 
            width: 20%; 
            background: #0f0f0f; 
            border: 1px solid #333; 
            border-left: none;
        }
        
        /* Log entry chat bubbles */
        .log-entry {
            margin-bottom: 12px;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 85%;
        }
        
        /* User input - right aligned, darker gray */
        .log-entry.input {
            margin-left: auto;
            background: #2a2a2a;
            border-bottom-right-radius: 4px;
        }
        
        /* AI/Narration - left aligned, dark cyan */
        .log-entry.narration {
            margin-right: auto;
            background: #1a3a3a;
            border-bottom-left-radius: 4px;
        }
        
        /* Dialogue - left aligned, orange tinted */
        .log-entry.dialogue {
            margin-right: auto;
            background: #3a2a1a;
            border-bottom-left-radius: 4px;
        }
        
        /* System - centered, yellow */
        .log-entry.system {
            margin-left: auto;
            margin-right: auto;
            background: #3a3a1a;
            text-align: center;
            max-width: 70%;
        }
        
        /* Timestamp - small gray above message */
        .log-entry .timestamp {
            display: block;
            font-size: 10px;
            color: #666;
            margin-bottom: 4px;
        }
        
        /* Sender name - bold, above message */
        .log-entry .sender {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #ff6b6b;
            margin-bottom: 4px;
        }
        
        /* Message text */
        .log-entry .text {
            font-size: 14px;
            line-height: 1.5;
        }
        
        .log-entry.narration .text { color: #00ffff; }
        .log-entry.dialogue .text { color: #ffb347; font-style: italic; }
        .log-entry.system .text { color: #ffff00; }
        .log-entry.input .text { color: #cccccc; }
        .log-entry.narration .sender { color: #00cccc; }
        .log-entry.dialogue .sender { color: #ffb347; }
        .log-entry.input .sender { color: #888888; }
        
        /* Visual sidebar styles */
        .visual-sidebar { display: flex; flex-direction: column; overflow: hidden; }
        .image-container { max-width: 100%; max-height: 200px; overflow: hidden; position: relative; box-sizing: border-box; }
        .image-container img { width: 100%; height: 100%; object-fit: contain; max-width: 100%; max-height: 180px; box-sizing: border-box; }
        .image-container .image-label { font-size: 12px; color: #888; text-align: center; padding: 4px; }
        .image-container.no-image { min-height: 60px; display: flex; align-items: center; justify-content: center; }
        .image-container.no-image .placeholder { color: #555; font-size: 12px; }
        .npc-portraits { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: flex-start; overflow-y: auto; flex: 1; box-sizing: border-box; }
        .npc-portrait { 
            width: 48%; 
            max-width: 48%;
            box-sizing: border-box; 
        }
        
        /* Action area */
        .action-area { background: #1a1a1a; border: 1px solid #333; border-bottom: none; padding: 10px 16px; display: flex; align-items: center; gap: 16px; height: 64px; flex-shrink: 0; }
        .command-form { display: flex; flex: 1; gap: 8px; align-items: center; }
        .command-form input { 
            flex: 1; 
            min-width: 200px; 
            background: #0d0d0d; 
            border: 1px solid #444; 
            border-radius: 4px;
            color: #e0e0e0; 
            padding: 8px 14px; 
            font-family: inherit; 
            font-size: 14px;
            height: 40px; 
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .command-form input:focus { 
            border-color: #00ff00; 
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.2);
        }
        .command-form input::placeholder { color: #555; }
        .command-form button { 
            background: linear-gradient(180deg, #00aa00 0%, #006600 100%); 
            border: 1px solid #00ff00; 
            border-radius: 4px;
            color: #00ff00; 
            padding: 8px 16px; 
            cursor: pointer; 
            height: 40px; 
            min-width: 100px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
            box-shadow: 0 0 8px rgba(0, 255, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .command-form button:hover { 
            background: linear-gradient(180deg, #00cc00 0%, #008800 100%); 
            border-color: #00ff00; 
            box-shadow: 0 0 12px rgba(0, 255, 0, 0.5);
        }
        .command-form button:active {
            background: linear-gradient(180deg, #006600 0%, #004400 100%);
            box-shadow: 0 0 4px rgba(0, 255, 0, 0.3);
        }
        .command-form button:disabled { 
            opacity: 0.5; 
            cursor: not-allowed; 
            box-shadow: none; 
        }
        
        /* Action hints */
        .action-hints { font-size: 12px; color: #888; }
        .action-hint { margin-right: 8px; }

        /* Status display */
        .status { font-size: 12px; margin-left: auto; min-width: 100px; text-align: right; }
        .status.ready { color: #00ff00; }
        .status.thinking { color: #ffff00; }
        .status.error { color: #ff4444; }
    </style>
</head>
<body>
    <div class="header" id="header" hx-get="/fragment/header" hx-trigger="load"></div>
    <div class="main-container">
        <div class="story-log" id="story-log" hx-get="/fragment/story-log" hx-trigger="load, every 5s" hx-swap="innerHTML" hx-on::after-swap="this.scrollTop = this.scrollHeight"></div>
        <div class="visual-sidebar" hx-get="/fragment/visual-sidebar" hx-trigger="load"></div>
    </div>
    <!-- Static shell: form stays in DOM, never replaced -->
    <div class="action-area">
        <!-- Form targets hidden div, status updates via WS + JS -->
        <form id="command-form" 
              hx-post="/action" 
              hx-target="#action-response" 
              hx-swap="innerHTML" 
              hx-on::after-request="this.reset(); updateToThinking();">
            <input type="text" name="command" placeholder="Enter command..." required minlength="1" autocomplete="off" />
            <button type="submit" id="submit-btn"><span class="btn-icon">&#9654;</span> Send</button>
        </form>
        <div id="action-response" style="display:none;"></div>
        <div class="action-hints" id="action-hints" hx-get="/hints" hx-trigger="load"></div>
        <div class="status ready" id="status-display"><span class="status ready">Ready</span></div>
    </div>
    <script>
        console.log('[HTMX] Initializing...');
        
        // Button state management
        const submitBtn = document.getElementById('submit-btn');
        
        function setButtonState(isThinking) {
            if (isThinking) {
                submitBtn.innerHTML = '<span class="btn-icon">&#9632;</span> Stop';
                submitBtn.disabled = true;
            } else {
                submitBtn.innerHTML = '<span class="btn-icon">&#9654;</span> Send';
                submitBtn.disabled = false;
            }
        }
        
        // Called immediately when form is submitted (before server responds)
        function updateToThinking() {
            setButtonState(true);
            const statusDisplay = document.getElementById('status-display');
            if (statusDisplay) {
                statusDisplay.innerHTML = '<span class="status thinking">Thinking...</span>';
            }
        }
        
        // Watch status display for changes
        const statusDisplay = document.getElementById('status-display');
        
        // Create a MutationObserver to watch for status changes
        const statusObserver = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'childList' || mutation.type === 'characterData') {
                    const statusText = statusDisplay.textContent;
                    if (statusText.includes('Thinking')) {
                        setButtonState(true);
                    } else if (statusText.includes('Ready')) {
                        setButtonState(false);
                    }
                }
            });
        });
        
        // Start observing when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            statusObserver.observe(statusDisplay, { 
                childList: true, 
                characterData: true,
                subtree: true 
            });
            
            // Also check initial state
            if (statusDisplay.textContent.includes('Thinking')) {
                setButtonState(true);
            }
        });
        
        </script>
</body>
</html>
