<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronicler Engine</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/assets/styles.css">
</head>
<body>
    <div class="error-notification" id="error-notification"></div>
<div class="header-bar">
        <div class="header" id="header" hx-get="/fragment/header" hx-trigger="load"></div>
    </div>
    <div class="tab-bar">
        <button class="tab active" data-tab="game">Game</button>
        <button class="tab" data-tab="settings">Settings</button>
    </div>
    <div class="tab-content active" id="game-tab">
    <div class="main-container">
        <div class="story-log" id="story-log" hx-get="/fragment/story-log" hx-trigger="load, every 2s" hx-swap="innerHTML"></div>
        <div class="visual-sidebar" hx-get="/fragment/visual-sidebar" hx-trigger="load, every 5s"></div>
    </div>
    
    <!-- Static shell: form stays in DOM, never replaced -->
        <div class="action-area" id="action-area">
        <!-- Form targets hidden div, status updates via WS + JS -->
        <form id="command-form"  
              hx-post="/action"  
              hx-target="#status-display"  
              hx-swap="innerHTML"  
              hx-on::after-request="this.reset(); updateButtonState();">
            <input type="text" name="command" placeholder="Enter command..." required minlength="1" autocomplete="off" />
            <button type="submit" id="submit-btn"><span class="btn-icon">&#9654;</span> Send</button>
        </form>
        <div class="action-hints" id="action-hints" hx-get="/hints" hx-trigger="load, every 5s"></div>
        <div class="status ready" id="status-display"  
             hx-get="/status/generating"  
             hx-trigger="load, every 5s"  
             hx-swap="innerHTML"
             hx-on::after-swap="onStatusPoll(this)"><span class="status ready">Ready</span></div>
    </div>
    </div>
    <div class="tab-content" id="settings-tab">
        <div class="settings-panel" hx-get="/fragment/settings" hx-trigger="load"></div>
    </div>
    <script>
        console.log('[HTMX] Initializing...');
        
        // Button state management
        const submitBtn = document.getElementById('submit-btn');
        
        function setButtonState(isThinking) {
            if (isThinking) {
                submitBtn.innerHTML = '<span class="btn-icon">&#9632;</span> Stop';
                submitBtn.disabled = true;
            } else {
                submitBtn.innerHTML = '<span class="btn-icon">&#9654;</span> Send';
                submitBtn.disabled = false;
            }
        }
        
        // Called immediately when form is submitted (before server responds)
        function updateToThinking() {
            setButtonState(true);
            const statusDisplay = document.getElementById('status-display');
            if (statusDisplay) {
                statusDisplay.innerHTML = '<span class="status thinking">Thinking...</span>';
            }
        }
        
        // Called after form submission to disable button immediately
        // The server returns status and MutationObserver will re-enable it
        function updateButtonState() {
            setButtonState(true); // Immediately disable button on submit
        }
        
        // Called after HTMX polls /status/generating
        // The endpoint returns "generating" or "idle" (plain text)
        function onStatusPoll(el) {
            const text = el.textContent.trim();
            if (text === 'idle') {
                el.innerHTML = '<span class="status ready">Ready</span>';
                setButtonState(false);
            } else if (text === 'generating') {
                el.innerHTML = '<span class="status thinking">Thinking...</span>';
                setButtonState(true);
            }
            // If text is empty or unexpected, do nothing
        }
        
        // Watch status display for changes
        const statusDisplay = document.getElementById('status-display');
        const errorNotification = document.getElementById('error-notification');
        
        // Show error notification at top of screen
        function showError(message) {
            if (errorNotification) {
                errorNotification.textContent = message;
                errorNotification.classList.add('visible');
                // Auto-hide after 5 seconds
                setTimeout(() => {
                    errorNotification.classList.remove('visible');
                }, 5000);
            }
        }
        
        // Edit functions - inline editing with polling pause
        let currentEditId = null;
        let originalText = null;
        let originalTrigger = null;
        
        function pausePolling() {
            const storyLog = document.getElementById('story-log');
            if (storyLog) {
                originalTrigger = storyLog.getAttribute('hx-trigger');
                storyLog.setAttribute('hx-trigger', 'none');
                // Force HTMX to re-read the trigger attribute
                htmx.process(storyLog);
            }
        }
        
        function resumePolling() {
            const storyLog = document.getElementById('story-log');
            if (storyLog && originalTrigger) {
                storyLog.setAttribute('hx-trigger', originalTrigger);
                htmx.process(storyLog);
                originalTrigger = null;
            }
        }
        
        function showEditForm(id) {
            currentEditId = id;
            const entry = document.querySelector(`[data-id="${id}"]`);
            if (entry) {
                const textSpan = entry.querySelector('.text');
                
                // Measure original height BEFORE replacing content
                const originalHeight = textSpan.scrollHeight;
                
                // Get raw text from data attribute (before markdown conversion)
                const rawText = entry.getAttribute('data-raw-text') || '';
                originalText = textSpan.innerHTML;
                
                // Replace text with textarea containing raw text (escape to prevent XSS)
                const escapedText = rawText.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                textSpan.innerHTML = `<textarea id="edit-textarea" class="edit-textarea">${escapedText}</textarea>`;
                
                // Set textarea height to match original
                const textarea = textSpan.querySelector('textarea');
                textarea.style.height = originalHeight + 'px';
                
                // Replace edit button with save/cancel
                const editBtn = entry.querySelector('.edit-btn');
                editBtn.outerHTML = `<button class="save-btn" onclick="submitEdit()">✓</button><button class="cancel-btn" onclick="cancelEdit()">✗</button>`;
                
                // Pause HTMX polling while editing
                pausePolling();
            }
        }
        
        function cancelEdit() {
            if (currentEditId === null) return;
            const entry = document.querySelector(`[data-id="${currentEditId}"]`);
            if (entry) {
                const textSpan = entry.querySelector('.text');
                textSpan.innerHTML = originalText;
                // Restore edit button
                const saveBtn = entry.querySelector('.save-btn');
                const cancelBtn = entry.querySelector('.cancel-btn');
                saveBtn.outerHTML = `<button class="edit-btn" onclick="showEditForm(${currentEditId})" title="Edit">&#9998;</button>`;
                cancelBtn.remove();
            }
            currentEditId = null;
            originalText = null;
            resumePolling();
        }
        
        function submitEdit() {
            if (currentEditId === null) return;
            const newText = document.getElementById('edit-textarea').value;
            const formData = new URLSearchParams();
            formData.append('text', newText);
            fetch(`/history/${currentEditId}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            }).then(() => {
                // Resume polling before refresh
                resumePolling();
                // Refresh story log
                htmx.trigger('#story-log', 'htmx:refresh');
            });
            currentEditId = null;
            originalText = null;
        }
        
        function submitRetry() {
            fetch('/retry', { method: 'POST' })
                .then(response => response.text())
                .then(() => {
                    // Refresh story log
                    htmx.trigger('#story-log', 'htmx:refresh');
                });
        }
        
        // Create a MutationObserver to watch for status changes
        const statusObserver = new MutationObserver(function(mutations) {
            mutations.forEach(function(mutation) {
                if (mutation.type === 'childList' || mutation.type === 'characterData') {
                    const statusText = statusDisplay.textContent;
                    // Re-enable button on ANY state that isn't thinking (Ready, Error, etc.)
                    if (statusText.includes('Thinking')) {
                        setButtonState(true);
                    } else {
                        setButtonState(false);
                    }
                    // Show error notification for error states
                    if (statusText.includes('Error')) {
                        showError(statusText);
                    }
                }
            });
        });
        
        // Start observing when DOM is ready
        document.addEventListener('DOMContentLoaded', function() {
            statusObserver.observe(statusDisplay, { 
                childList: true, 
                characterData: true,
                subtree: true 
            });
            
            // Also check initial state
            if (statusDisplay.textContent.includes('Thinking')) {
                setButtonState(true);
            }

            // Tab switching
            document.querySelectorAll('.tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
                    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    document.getElementById(btn.dataset.tab + '-tab').classList.add('active');
                });
            });
        });
        
        </script>
</body>
</html>
