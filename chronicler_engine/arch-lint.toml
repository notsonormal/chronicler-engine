# Architecture linting configuration for Chronicler Engine
# [DOC: docs/architecture/guardrails.md]
#
# This file defines the architectural guardrails that enforce
# the project's coding standards via arch-lint.
# Run with: cargo nextest run --test architecture

preset = "recommended"
fail_on = "error"

[analyzer]
root = "./src"
exclude = [
    "**/target/**",
    "**/tests/**",
    "**/*_tests.rs",
]

# ── Built-in rule overrides ──

[rules.no-unwrap-expect]
enabled = true
severity = "error"
allow_in_tests = true

# Project uses `log` + `env_logger`, not `tracing`.
[rules.require-tracing]
enabled = false

# Sync I/O is used intentionally in non-async startup / CLI contexts.
[rules.no-sync-io]
enabled = false

# Public items should be documented.
[rules.require-doc-comments]
enabled = true
severity = "warning"

# ── Declarative layer rules ──
# Enforce clean architecture: inner layers must not depend on outer layers.

[[scopes]]
name = "model"
paths = ["src/domain/model/**"]

[[scopes]]
name = "engine"
paths = ["src/domain/engine/**"]

[[scopes]]
name = "narrative"
paths = ["src/narrative/**"]

[[scopes]]
name = "application"
paths = ["src/application/**"]

[[scopes]]
name = "server"
paths = ["src/adapters/driving/http/**"]

# Model (innermost) must not depend on any outer layer.
[[deny-scope-dep]]
from = "model"
to = ["server", "narrative", "engine", "application"]
message = "Model layer must be pure; cannot depend on outer layers."

# Engine must not depend on outer layers (server, application, or narrative).
[[deny-scope-dep]]
from = "engine"
to = ["server", "application", "narrative"]
message = "Engine layer must not depend on server, application, or narrative layers."

# Application must not depend on server.
[[deny-scope-dep]]
from = "application"
to = ["server"]
message = "Application layer must not depend on server layer."

# ── Storage model isolation ──
# DB models and mappers are an internal storage concern.

[[scopes]]
name = "storage"
paths = ["src/storage/**"]

[[scopes]]
name = "storage-models"
paths = ["src/storage/models/**", "src/storage/mappers/**"]

[[scopes]]
name = "bootstrap"
paths = ["src/bootstrap/**"]

[[scopes]]
name = "test-support"
paths = ["src/test_support/**"]

[[deny-scope-dep]]
from = "model"
to = ["storage-models"]
message = "Model layer must not depend on storage DB models/mappers."

[[deny-scope-dep]]
from = "engine"
to = ["storage-models"]
message = "Engine layer must not depend on storage DB models/mappers."

[[deny-scope-dep]]
from = "narrative"
to = ["storage-models"]
message = "Narrative layer must not depend on storage DB models/mappers."

[[deny-scope-dep]]
from = "application"
to = ["storage-models"]
message = "Application layer must not depend on storage DB models/mappers."

[[deny-scope-dep]]
from = "server"
to = ["storage-models"]
message = "Server layer must not depend on storage DB models/mappers."

[[deny-scope-dep]]
from = "bootstrap"
to = ["storage-models"]
message = "Bootstrap layer must not depend on storage DB models/mappers."

[[deny-scope-dep]]
from = "test-support"
to = ["storage-models"]
message = "Test support must not depend on storage DB models/mappers."

# Server layer must not depend on storage directly; all storage access goes through ApplicationService.
[[deny-scope-dep]]
from = "server"
to = ["storage"]
message = "Server layer must not import from storage directly; use ApplicationService instead."
