# Architecture linting configuration for Chronicler Engine
# [DOC: docs/architecture/guardrails.md]
#
# This file defines the architectural guardrails that enforce
# the project's coding standards via arch-lint.
# Run with: cargo test --test architecture

preset = "recommended"
fail_on = "error"

[analyzer]
root = "./src"
exclude = [
    "**/target/**",
    "**/tests/**",
]

# ── Built-in rule overrides ──

[rules.no-unwrap-expect]
enabled = true
severity = "error"
allow_in_tests = true

# Project uses `log` + `env_logger`, not `tracing`.
[rules.require-tracing]
enabled = false

# Sync I/O is used intentionally in non-async startup / CLI contexts.
[rules.no-sync-io]
enabled = false

# Public items should be documented.
[rules.require-doc-comments]
enabled = true
severity = "warning"

# ── Declarative layer rules ──
# Enforce clean architecture: inner layers must not depend on outer layers.

[[scopes]]
name = "model"
paths = ["src/model/**"]

[[scopes]]
name = "engine"
paths = ["src/engine/**"]

[[scopes]]
name = "narrative"
paths = ["src/narrative/**"]

[[scopes]]
name = "server"
paths = ["src/server/**"]

# Model (innermost) must not depend on any outer layer.
[[deny-scope-dep]]
from = "model"
to = ["server", "narrative", "engine"]
message = "Model layer must be pure; cannot depend on server, narrative, or engine layers."

# Engine should not depend directly on server.
[[deny-scope-dep]]
from = "engine"
to = ["server"]
message = "Engine layer should not depend directly on server layer."
