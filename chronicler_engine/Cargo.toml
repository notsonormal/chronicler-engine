[package]
name = "chronicler_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenv = "0.15.0"
reqwest = { version = "0.13.2", features = ["blocking", "json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.128"
image = "0.25.10"
ratatui = "0.30.0"
crossterm = "0.28.1"
ratatui-image = { version = "10.0.6", default-features = false, features = ["crossterm", "image-defaults"] }
lazy_static = "1.5.0"
colored = "3.1.1"
thiserror = "2.0.18"


