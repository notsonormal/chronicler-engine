[package]
name = "chronicler_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dotenv = "0.15.0"
reqwest = { version = "0.13.2", features = ["blocking", "json", "gzip", "brotli"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.128"
image = "0.25.10"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.5", features = ["fs"] }
http = "1"
futures-util = "0.3"
thiserror = "2.0.18"
chrono = { version = "0.4", features = ["serde"] }
tokio-stream = "0.1"
async-stream = "0.3"
log = "0.4"
env_logger = "0.11"
pulldown-cmark = "0.13"
askama = "0.15"
regex = "1.11"
once_cell = "1.20"

[dev-dependencies]
playwright-rs = "0.9"
reqwest = { version = "0.13", features = ["json", "form"] }
tower = "0.5"
dotenv = "0.15.0"
arch-lint = "0.4"
syn = { version = "2.0", features = ["full", "visit"] }
quote = "1.0"
walkdir = "2.5"

[features]
default = []