# Vale prose linter config for Chronicler Engine docs.
#
# Scope matches scripts/validate_docs.py STANDARD docs:
#   - Includes: docs/ excluding plans/, adr/000-template, AGENTS.md AUTO-INDEX
#   - Style:    Custom `Chronicler` package only (no built-in styles)
#
# Run:
#   python scripts/vale_lint.py                  # all STANDARD docs
#   python scripts/vale_lint.py path/to/file.md  # specific files
#   python scripts/vale_lint.py --json           # CI-friendly output

StylesPath = styles

MinAlertLevel = suggestion

[*.md]
BasedOnStyles = Chronicler

# Skipped paths — mirror validate_docs.py TRANSIENT/EXCLUDED scope.
# Vale applies `--config` against explicit paths only; the wrapper script
# handles directory-level exclusion. Listed here for documentation.

# Excluded dirs (transient / meta):
#   docs/plans/**
#   docs/old-docs/**
#   docs/AGENTS.md  (AUTO-INDEX block only; prose preamble owned by per-edit gate)
#   CHANGELOG.md
