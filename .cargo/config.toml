# Cargo build configuration for Chronicler Engine
# Optimized release builds

# sccache lets worktree builds reuse compiled dependencies (AGENTS.md,
# "Concurrent Builds"). The wrapper falls back to plain rustc when sccache is
# not installed, so this config stays portable.
[build]
rustc-wrapper = "scripts/sccache-wrapper.sh"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev]
opt-level = 0
# Backtraces keep file and line. Variable-level debugger inspection is dropped.
# Measured: binary 178 MiB -> 81 MiB, relink 1.85 s -> 1.23 s (see the commit that added this line).
debug = "line-tables-only"