<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronicler Engine</title>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <link rel="stylesheet" href="/assets/styles.css?v=3" />
    <link rel="stylesheet" href="/assets/worlds.css?v=4" />
    <link rel="stylesheet" href="/assets/games.css?v=1" />
  </head>
  <body>
    <div class="error-notification" id="error-notification"></div>
    <div class="header-bar">
      <div
        class="header"
        id="header"
        hx-get="/fragment/header"
        hx-trigger="load"
      ></div>
    </div>
    <div class="tab-bar">
      <button class="tab active" data-tab="game">Game</button>
      <button class="tab" data-tab="settings">Settings</button>
      <button class="tab" data-tab="prompt-presets">Prompt Presets</button>
      <button class="tab" data-tab="worlds">Worlds</button>
      <button class="tab" data-tab="games">Games</button>
      <button class="tab" data-tab="llm-messages">LLM Messages</button>
    </div>
    <div class="tab-content active" id="game-tab">
      <div class="main-container">
        <div
          class="story-log"
          id="story-log"
          hx-get="/fragment/story-log"
          hx-trigger="load, every 2s"
          hx-swap="innerHTML"
        ></div>
        <div
          class="visual-sidebar"
          hx-get="/fragment/visual-sidebar"
          hx-trigger="load, every 5s"
        ></div>
      </div>

      <!-- Static shell: form stays in DOM, never replaced -->
      <div class="action-area" id="action-area">
        <form
          id="command-form"
          hx-post="/action/check"
          hx-target="#action-area"
          hx-swap="innerHTML"
          hx-sync="this:drop"
          hx-on::before-request="saveActionArea()"
          hx-on::after-request="onActionFormAfterRequest()"
        >
          <input
            type="text"
            name="command"
            placeholder="Enter command..."
            autocomplete="off"
          />
          <button type="submit" id="submit-btn">
            <span class="btn-icon">&#9654;</span> Send
          </button>
        </form>
        <div
          class="status ready"
          id="status-display"
          hx-get="/status/generating"
          hx-trigger="load, every 5s"
          hx-swap="innerHTML"
          hx-on::after-swap="onStatusPoll(this)"
        >
          <span class="status ready">Ready</span>
        </div>
      </div>
    </div>
    <div class="tab-content" id="settings-tab">
      <div
        class="settings-panel"
        hx-get="/fragment/settings"
        hx-trigger="load"
      ></div>
    </div>
    <div class="tab-content" id="prompt-presets-tab">
      <div
        class="prompt-presets-panel"
        hx-get="/fragment/prompt-presets"
        hx-trigger="load"
      ></div>
    </div>
    <div class="tab-content" id="worlds-tab">
      <div
        class="worlds-panel"
        hx-get="/fragment/worlds"
        hx-trigger="load"
      ></div>
    </div>
    <div class="tab-content" id="games-tab">
      <div
        class="games-panel"
        hx-get="/fragment/games"
        hx-trigger="load"
      ></div>
    </div>
    <div class="tab-content" id="llm-messages-tab">
      <div
        class="llm-messages-panel"
        hx-get="/fragment/llm-messages"
        hx-trigger="load, every 4s"
        hx-swap="innerHTML"
        hx-on::after-swap="restoreLlmExpandedState()"
      ></div>
    </div>


    <script>
      console.log("[HTMX] Initializing...");

      // Button state management
      const submitBtn = document.getElementById("submit-btn");

      function setButtonState(isThinking) {
        if (isThinking) {
          submitBtn.innerHTML = '<span class="btn-icon">&#9632;</span> Stop';
          submitBtn.disabled = true;
        } else {
          submitBtn.innerHTML = '<span class="btn-icon">&#9654;</span> Send';
          submitBtn.disabled = false;
        }
      }

      // Called immediately when form is submitted (before server responds)
      function updateToThinking() {
        setButtonState(true);
        const statusDisplay = document.getElementById("status-display");
        if (statusDisplay) {
          statusDisplay.innerHTML =
            '<span class="status thinking">Thinking...</span>';
        }
      }

      // The server returns status and MutationObserver will re-enable it
      function updateButtonState() {
        setButtonState(true); // Immediately disable button on submit
      }

      // The endpoint returns phase names or "idle" (plain text)
      function onStatusPoll(el) {
        const text = el.textContent.trim();
        if (text === "idle") {
          el.innerHTML = '<span class="status ready">Ready</span>';
          setButtonState(false);
        } else if (
          text === "narrating" ||
          text === "quantifying" ||
          text === "generating-event"
        ) {
          const phaseMap = {
            narrating: "Generating narration...",
            quantifying: "Quantifying scene...",
            "generating-event": "Generating event...",
          };
          el.innerHTML =
            '<span class="status thinking">' + phaseMap[text] + "</span>";
          setButtonState(true);
        }
        // If text is empty or unexpected, do nothing
      }

      const statusDisplay = document.getElementById("status-display");
      const errorNotification = document.getElementById("error-notification");

      function showError(message) {
        if (errorNotification) {
          errorNotification.textContent = message;
          errorNotification.classList.add("visible");
          setTimeout(() => {
            errorNotification.classList.remove("visible");
          }, 5000);
        }
      }

      // Global HTMX error handler - shows notification for errors, allows swap to proceed
      document.body.addEventListener("htmx:beforeSwap", function (evt) {
        if (evt.detail.isError) {
          const response = evt.detail.serverResponse || "";
          const text = response.replace(/<[^>]*>/g, "").trim();
          showError(text || "Request failed");
        }
      });

      // Edit functions - inline editing with polling pause
      let currentEditId = null;
      let originalText = null;
      let originalTrigger = null;

      function pausePolling() {
        const storyLog = document.getElementById("story-log");
        if (storyLog) {
          originalTrigger = storyLog.getAttribute("hx-trigger");
          storyLog.setAttribute("hx-trigger", "none");
          htmx.process(storyLog);
        }
      }

      function resumePolling() {
        const storyLog = document.getElementById("story-log");
        if (storyLog && originalTrigger) {
          storyLog.setAttribute("hx-trigger", originalTrigger);
          htmx.process(storyLog);
          originalTrigger = null;
        }
      }

      function autoResizeTextarea(textarea) {
        textarea.style.height = "auto";
        textarea.style.height = textarea.scrollHeight + "px";
      }

      function showEditForm(id) {
        currentEditId = id;
        const entry = document.querySelector(`[data-id="${id}"]`);
        if (entry) {
          const textSpan = entry.querySelector(".text");

          // Measure original rendered height BEFORE replacing content
          const originalHeight = textSpan.getBoundingClientRect().height;

          // Get raw text from data attribute (before markdown conversion)
          const rawText = entry.getAttribute("data-raw-text") || "";
          originalText = textSpan.innerHTML;

          textSpan.innerHTML = "";
          const textarea = document.createElement("textarea");
          textarea.id = "edit-textarea";
          textarea.className = "edit-textarea";
          textarea.textContent = rawText;
          textSpan.appendChild(textarea);
          // .edit-textarea has 4px padding top+bottom + 1px border top+bottom = 10px extra
          const textareaExtra = 10;
          textarea.style.height = originalHeight + textareaExtra + "px";

          textarea.addEventListener("input", function () {
            autoResizeTextarea(this);
          });

          const actionsContainer = entry.querySelector(".message-actions");
          if (actionsContainer) {
            actionsContainer.innerHTML = `<button class="save-btn" onclick="submitEdit()" title="Save">✓</button><button class="cancel-btn" onclick="cancelEdit()" title="Cancel">✗</button>`;
          }

          pausePolling();
        }
      }

      function cancelEdit() {
        if (currentEditId === null) return;
        const entry = document.querySelector(`[data-id="${currentEditId}"]`);
        if (entry) {
          const textSpan = entry.querySelector(".text");
          textSpan.innerHTML = originalText;
        }
        currentEditId = null;
        originalText = null;
        resumePolling();
        htmx.trigger("#story-log", "htmx:refresh");
      }

      function submitEdit() {
        if (currentEditId === null) return;
        const newText = document.getElementById("edit-textarea").value;
        const formData = new URLSearchParams();
        formData.append("text", newText);
        fetch(`/history/${currentEditId}`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData,
        }).then(() => {
          resumePolling();
          htmx.trigger("#story-log", "htmx:refresh");
        });
        currentEditId = null;
        originalText = null;
      }

      function submitNewSwipe() {
        updateToThinking();
        fetch("/swipe/new", { method: "POST" })
          .then((response) => response.text())
          .then(() => {
            htmx.trigger("#story-log", "htmx:refresh");
          });
      }

      function submitRetrigger() {
        updateToThinking();
        fetch("/retrigger", { method: "POST" })
          .then((response) => response.text())
          .then(() => {
            htmx.trigger("#story-log", "htmx:refresh");
          });
      }

      function switchSwipe(messageId, index) {
        fetch(`/message/${messageId}/swipe/${index}`, { method: "POST" })
          .then((response) => {
            if (response.ok) {
              return response.text();
            }
            throw new Error("Swipe switch failed");
          })
          .then((html) => {
            document.getElementById("story-log").innerHTML = html;
            // Refresh visual sidebar and header to reflect restored state
            htmx.trigger("#visual-sidebar", "htmx:refresh");
            htmx.trigger("#header", "htmx:refresh");
          })
          .catch((err) => {
            console.error("Swipe switch failed:", err);
            showError("Failed to switch swipe");
          });
      }

      function deleteMessage() {
        if (!confirm("Delete this message?")) return;
        fetch("/history/delete", { method: "POST" })
          .then((response) => {
            if (response.ok) {
              htmx.ajax("GET", "/fragment/story-log", {
                target: "#story-log",
                swap: "innerHTML",
              });
            } else {
              response.text().then((text) => showError(text));
            }
          })
          .catch((err) => {
            console.error("Delete failed:", err);
            showError("Failed to delete message");
          });
      }

      // Text check helpers
      function saveActionArea() {
        const actionArea = document.getElementById("action-area");
        const input = actionArea.querySelector('input[name="command"]');
        const btn = actionArea.querySelector("#submit-btn");
        actionArea.dataset.originalHtml = actionArea.innerHTML;
        if (input) {
          actionArea.dataset.originalValue = input.value;
        }
        if (btn) {
          btn.disabled = true;
        }
      }

      function onActionFormAfterRequest() {
        const form = document.getElementById("command-form");
        if (form && form.querySelector("input[name=command]")) {
          form.reset();
          updateButtonState();
        }
      }

      function checkCurrentInput() {
        const input = document.querySelector(
          '#command-form input[name="command"]',
        );
        if (!input || !input.value.trim()) return;
        checkText(input.value.trim());
      }

      function htmlUnescape(str) {
        const textarea = document.createElement("textarea");
        textarea.innerHTML = str;
        return textarea.value;
      }

      function checkText(text) {
        const formData = new URLSearchParams();
        formData.append("command", text);

        fetch("/check-text", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData,
        })
          .then((response) => response.text())
          .then((html) => {
            const actionArea = document.getElementById("action-area");
            if (actionArea) {
              saveActionArea();
              actionArea.innerHTML = html;
            }
          })
          .catch((err) => {
            console.error("Text check failed:", err);
            restoreActionArea();
          });
      }

      function checkLogText(rawText) {
        checkText(htmlUnescape(rawText));
      }

      function restoreActionArea() {
        const actionArea = document.getElementById("action-area");
        if (actionArea && actionArea.dataset.originalHtml) {
          actionArea.innerHTML = actionArea.dataset.originalHtml;
          if (actionArea.dataset.originalValue) {
            const input = actionArea.querySelector('input[name="command"]');
            if (input) {
              input.value = actionArea.dataset.originalValue;
            }
          }
          htmx.process(actionArea);
        }
      }

      const SLASH_COMMANDS = [
        { cmd: "/narrator", desc: "Narrator action (permanent)" },
        { cmd: "/impersonate", desc: "Write as the player persona" },
        { cmd: "/guide", desc: "Steer the next generation (transient)" },
      ];
      let slashMenu = null;
      let slashMatches = [];
      let slashActiveIndex = -1;

      function commandInput() {
        return document.querySelector('#command-form input[name="command"]');
      }

      function closeSlashMenu() {
        if (slashMenu) {
          slashMenu.remove();
          slashMenu = null;
        }
        slashMatches = [];
        slashActiveIndex = -1;
      }

      function slashMatchesFor(value) {
        const v = value.trimStart();
        if (!v.startsWith("/")) return [];
        return SLASH_COMMANDS.filter((c) => c.cmd.startsWith(v));
      }

      function positionSlashMenu(input) {
        if (!slashMenu) return;
        const rect = input.getBoundingClientRect();
        slashMenu.style.left = rect.left + "px";
        slashMenu.style.bottom = window.innerHeight - rect.top + 4 + "px";
      }

      function renderSlashMenu(input) {
        if (slashMatches.length === 0) {
          closeSlashMenu();
          return;
        }
        if (!slashMenu) {
          slashMenu = document.createElement("div");
          slashMenu.className = "slash-menu";
          slashMenu.id = "slash-menu";
          document.body.appendChild(slashMenu);
        }
        slashMenu.innerHTML = "";
        slashMatches.forEach((m, i) => {
          const item = document.createElement("div");
          item.className = "slash-suggestion" + (i === slashActiveIndex ? " active" : "");
          item.dataset.cmd = m.cmd;
          const cmdSpan = document.createElement("span");
          cmdSpan.className = "slash-cmd";
          cmdSpan.textContent = m.cmd;
          const descSpan = document.createElement("span");
          descSpan.className = "slash-desc";
          descSpan.textContent = m.desc;
          item.appendChild(cmdSpan);
          item.appendChild(descSpan);
          slashMenu.appendChild(item);
        });
        positionSlashMenu(input);
      }

      function openSlashMenu(input) {
        slashMatches = slashMatchesFor(input.value);
        slashActiveIndex = slashMatches.length > 0 ? 0 : -1;
        renderSlashMenu(input);
      }

      function selectSlash(cmd, input) {
        input.value = cmd + " ";
        input.focus();
        const len = input.value.length;
        input.setSelectionRange(len, len);
        closeSlashMenu();
      }

      function setSlashActive(index) {
        slashActiveIndex = index;
        if (slashMenu) {
          slashMenu.querySelectorAll(".slash-suggestion").forEach((el, i) => {
            el.classList.toggle("active", i === slashActiveIndex);
          });
        }
      }

      document.addEventListener("input", function (e) {
        const input = e.target;
        if (!(input instanceof HTMLElement)) return;
        if (!input.matches('#command-form input[name="command"]')) return;
        openSlashMenu(input);
      });

      document.addEventListener("keydown", function (e) {
        const input = commandInput();
        if (!input || e.target !== input) return;
        if (!slashMenu) return;
        if (e.key === "ArrowDown") {
          e.preventDefault();
          if (slashMatches.length > 0) {
            setSlashActive((slashActiveIndex + 1) % slashMatches.length);
          }
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (slashMatches.length > 0) {
            setSlashActive((slashActiveIndex - 1 + slashMatches.length) % slashMatches.length);
          }
        } else if (e.key === "Enter") {
          if (slashMatches.length > 0 && slashActiveIndex >= 0) {
            e.preventDefault();
            selectSlash(slashMatches[slashActiveIndex].cmd, input);
          } else {
            closeSlashMenu();
          }
        } else if (e.key === "Escape") {
          e.preventDefault();
          closeSlashMenu();
        }
      });

      // mousedown on a suggestion selects (fires before the input blurs).
      document.addEventListener("mousedown", function (e) {
        const target = e.target;
        if (!(target instanceof HTMLElement)) return;
        const item = target.closest(".slash-suggestion");
        if (item && slashMenu && slashMenu.contains(item)) {
          e.preventDefault();
          const input = commandInput();
          if (input) selectSlash(item.dataset.cmd, input);
          return;
        }
        // Click outside the menu and the input closes the menu.
        if (slashMenu && !slashMenu.contains(target) && target !== commandInput()) {
          closeSlashMenu();
        }
      });

      // Close the menu when the input loses focus (focusout bubbles).
      document.addEventListener("focusout", function (e) {
        if (!slashMenu) return;
        if (e.target === commandInput()) {
          setTimeout(() => {
            if (commandInput() !== document.activeElement && slashMenu) {
              closeSlashMenu();
            }
          }, 150);
        }
      });

      // Close on form submit — the text-check swap recreates the input.
      document.addEventListener("submit", closeSlashMenu, true);

      // Close on scroll/resize — the fixed position is stale once the
      // viewport moves.
      window.addEventListener("scroll", closeSlashMenu, true);
      window.addEventListener("resize", closeSlashMenu);

      const statusObserver = new MutationObserver(function (mutations) {
        mutations.forEach(function (mutation) {
          if (
            mutation.type === "childList" ||
            mutation.type === "characterData"
          ) {
            // Check if the inner status span has the 'thinking' class
            const isThinking =
              statusDisplay.querySelector(".status.thinking") !== null;
            if (isThinking) {
              setButtonState(true);
            } else {
              setButtonState(false);
            }
            // Show error notification for error states
            const statusText = statusDisplay.textContent;
            if (statusText.includes("Error")) {
              showError(statusText);
            }
          }
        });
      });

      document.body.addEventListener("action-area-refresh", function () {
        htmx.ajax("GET", "/fragment/action-area", {
          target: "#action-area",
          swap: "outerHTML",
        });
      });

      document.addEventListener("DOMContentLoaded", function () {
        statusObserver.observe(statusDisplay, {
          childList: true,
          characterData: true,
          subtree: true,
        });

        if (statusDisplay.textContent.includes("Thinking")) {
          setButtonState(true);
        }

        // Tab switching
        document.querySelectorAll(".tab").forEach((btn) => {
          btn.addEventListener("click", () => {
            document
              .querySelectorAll(".tab")
              .forEach((b) => b.classList.remove("active"));
            document
              .querySelectorAll(".tab-content")
              .forEach((c) => c.classList.remove("active"));
            btn.classList.add("active");
            document
              .getElementById(btn.dataset.tab + "-tab")
              .classList.add("active");

            if (btn.dataset.tab === "llm-messages") {
              const panel = document.querySelector(".llm-messages-panel");
              if (panel) {
                htmx.trigger(panel, "htmx:refresh");
              }
            }
          });
        });

        // LLM message expand/collapse - persists across HTMX polls
        const expandedLlmMessages = new Set();
        let llmOriginalTrigger = null;

        function pauseLlmPolling() {
          const panel = document.querySelector(".llm-messages-panel");
          if (panel) {
            llmOriginalTrigger = panel.getAttribute("hx-trigger");
            panel.setAttribute("hx-trigger", "none");
            htmx.process(panel);
          }
        }

        function resumeLlmPolling() {
          const panel = document.querySelector(".llm-messages-panel");
          if (panel && llmOriginalTrigger) {
            panel.setAttribute("hx-trigger", llmOriginalTrigger);
            htmx.process(panel);
            llmOriginalTrigger = null;
          }
        }

        window.toggleLlmMessage = function (header) {
          const card = header.closest(".llm-message-card");
          if (card) {
            card.classList.toggle("expanded");
            const msgId = card.id;
            if (msgId) {
              if (card.classList.contains("expanded")) {
                expandedLlmMessages.add(msgId);
                pauseLlmPolling();
              } else {
                expandedLlmMessages.delete(msgId);
                if (expandedLlmMessages.size === 0) {
                  resumeLlmPolling();
                }
              }
            }
          }
        };

        window.restoreLlmExpandedState = function () {
          expandedLlmMessages.forEach(function (msgId) {
            const card = document.getElementById(msgId);
            if (card) {
              card.classList.add("expanded");
            } else {
              expandedLlmMessages.delete(msgId);
            }
          });
        };


      });
    </script>
  </body>
</html>
