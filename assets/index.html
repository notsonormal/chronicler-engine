<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronicler Engine</title>
    <script src="/assets/htmx.min.js?v=1"></script>
    <script src="/assets/idiomorph-ext.min.js?v=1"></script>
    <link rel="stylesheet" href="/assets/styles.css?v=6" />
    <link rel="stylesheet" href="/assets/worlds.css?v=6" />
    <link rel="stylesheet" href="/assets/games.css?v=3" />
  </head>
  <body hx-ext="morph">
    <!-- Icons are Lucide (ISC; the Feather-derived ones MIT); licence text in /assets/LICENSE-lucide.txt. -->
    <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
      <symbol id="i-pencil" viewBox="0 0 24 24">
        <path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z" />
        <path d="m15 5 4 4" />
      </symbol>
      <symbol id="i-trash" viewBox="0 0 24 24">
        <path d="M10 11v6" />
        <path d="M14 11v6" />
        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
        <path d="M3 6h18" />
        <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      </symbol>
      <symbol id="i-zap" viewBox="0 0 24 24">
        <path d="M15.914 4a1.5 1.5 0 00-2.474-1.561l-9 9A1.5 1.5 0 005.5 14h4.002a.5.5 0 01.471.666L8.086 20a1.5 1.5 0 002.475 1.56l9-9A1.5 1.5 0 0018.5 10h-3.997a.5.5 0 01-.472-.667z" />
      </symbol>
      <symbol id="i-refresh-cw" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
        <path d="M21 3v5h-5" />
        <path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16" />
        <path d="M8 16H3v5" />
      </symbol>
      <symbol id="i-rotate-ccw" viewBox="0 0 24 24">
        <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
        <path d="M3 3v5h5" />
      </symbol>
      <symbol id="i-chevron-left" viewBox="0 0 24 24">
        <path d="m15 18-6-6 6-6" />
      </symbol>
      <symbol id="i-chevron-right" viewBox="0 0 24 24">
        <path d="m9 18 6-6-6-6" />
      </symbol>
      <symbol id="i-check" viewBox="0 0 24 24">
        <path d="M20 6 9 17l-5-5" />
      </symbol>
      <symbol id="i-x" viewBox="0 0 24 24">
        <path d="M18 6 6 18" />
        <path d="m6 6 12 12" />
      </symbol>
      <symbol id="i-send" viewBox="0 0 24 24">
        <path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z" />
        <path d="m21.854 2.147-10.94 10.939" />
      </symbol>
      <symbol id="i-loader-circle" viewBox="0 0 24 24">
        <path d="M21 12a9 9 0 1 1-6.219-8.56" />
      </symbol>
      <symbol id="i-spell-check" viewBox="0 0 24 24">
        <path d="m20 15-5.5 5.5L12 18" />
        <path d="m4 16 6-12 5.115 10.23" />
        <path d="M6 12h8" />
      </symbol>
      <symbol id="i-triangle-alert" viewBox="0 0 24 24">
        <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
        <path d="M12 9v4" />
        <path d="M12 17h.01" />
      </symbol>
    </svg>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="header-bar">
      <div
        class="header"
        id="header"
        hx-get="/fragment/header"
        hx-trigger="load, every 5s"
        hx-swap="innerHTML"
      ></div>
    </div>
    <div id="failure-banner" class="failure-banner" role="status" hidden>
      <div id="failure-banner-degraded" class="failure-banner-degraded"></div>
      <div id="failure-banner-unreachable" class="failure-banner-unreachable"></div>
    </div>
    <div class="tab-bar" role="tablist" aria-label="Dashboard sections">
      <button class="tab active" role="tab" id="tab-game" aria-controls="game-tab" aria-selected="true" data-tab="game">Game</button>
      <button class="tab" role="tab" id="tab-settings" aria-controls="settings-tab" aria-selected="false" data-tab="settings">Settings</button>
      <button class="tab" role="tab" id="tab-prompt-presets" aria-controls="prompt-presets-tab" aria-selected="false" data-tab="prompt-presets">Prompt Presets</button>
      <button class="tab" role="tab" id="tab-worlds" aria-controls="worlds-tab" aria-selected="false" data-tab="worlds">Worlds</button>
      <button class="tab" role="tab" id="tab-games" aria-controls="games-tab" aria-selected="false" data-tab="games">Games</button>
      <button class="tab" role="tab" id="tab-llm-messages" aria-controls="llm-messages-tab" aria-selected="false" data-tab="llm-messages">LLM Messages</button>
    </div>
    <main id="main-content" class="main-content" tabindex="-1">
    <div class="tab-content active" id="game-tab" role="tabpanel" aria-labelledby="tab-game">
      <div class="main-container">
        <div
          class="story-log"
          id="story-log"
          tabindex="0"
          aria-label="Story log"
          hx-get="/fragment/story-log"
          hx-trigger="load, every 2s"
          hx-swap="morph:innerHTML"
        ></div>
        <div
          class="visual-sidebar"
          hx-get="/fragment/visual-sidebar"
          hx-trigger="load, every 5s"
        ></div>
      </div>

      <div
        id="options-dock"
        hx-get="/fragment/options-dock"
        hx-trigger="load, every 2s"
        hx-swap="innerHTML"
      ></div>
      <div class="action-area" id="action-area">
        <div id="action-preview" class="action-preview"></div>
        <form
          id="command-form"
          hx-post="/action/check"
          hx-target="#action-preview"
          hx-swap="innerHTML"
          hx-sync="this:drop"
          hx-on::before-request="onCommandBeforeRequest()"
          hx-on::after-request="onCommandAfterRequest()"
        >
          <label class="visually-hidden" for="command-input">Command</label>
          <input
            id="command-input"
            type="text"
            name="command"
            placeholder="Enter command..."
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="slash-menu"
            aria-autocomplete="list"
          />
          <button type="submit" id="submit-btn">
            <svg class="icon" aria-hidden="true"><use href="#i-send" /></svg> Send
          </button>
          <div class="inline-error-slot" data-error-slot="action" hidden></div>
        </form>
        <div
          class="status ready"
          id="status-display"
          hx-get="/status/generating"
          hx-trigger="load, every 5s"
          hx-swap="innerHTML"
          hx-on::after-swap="onStatusPoll(this)"
        >
          <span class="status ready">Ready</span>
        </div>
      </div>
      <div
        id="restore-notice"
        class="restore-notice"
        role="status"
        aria-live="polite"
      ></div>
      <!-- Outside the polled log, so a poll cannot drop a failure the log reported. -->
      <div
        id="story-log-error"
        class="story-log-error"
        data-error-slot="story-log"
        hidden
      ></div>
      <!-- Separate regions so a poll does not re-announce unchanged content every cycle. -->
      <div
        id="narration-announcer"
        class="visually-hidden"
        role="status"
        aria-live="polite"
      ></div>
      <div
        id="options-announcer"
        class="visually-hidden"
        role="status"
        aria-live="polite"
      ></div>
      <div
        id="status-announcer"
        class="visually-hidden"
        role="status"
        aria-live="polite"
      ></div>
      <div
        id="status-error-announcer"
        class="visually-hidden"
        role="alert"
      ></div>
    </div>
    <div class="tab-content" id="settings-tab" role="tabpanel" aria-labelledby="tab-settings">
      <div
        class="settings-panel"
        hx-get="/fragment/settings"
        hx-trigger="load"
      ></div>
    </div>
    <div class="tab-content" id="prompt-presets-tab" role="tabpanel" aria-labelledby="tab-prompt-presets">
      <div
        class="prompt-presets-panel"
        hx-get="/fragment/prompt-presets"
        hx-trigger="load"
      ></div>
    </div>
    <div class="tab-content" id="worlds-tab" role="tabpanel" aria-labelledby="tab-worlds">
      <div
        class="worlds-panel"
        hx-get="/fragment/worlds"
        hx-trigger="load"
      ></div>
    </div>
    <div class="tab-content" id="games-tab" role="tabpanel" aria-labelledby="tab-games">
      <div
        class="games-panel"
        hx-get="/fragment/games"
        hx-trigger="load"
      ></div>
    </div>
    <div class="tab-content" id="llm-messages-tab" role="tabpanel" aria-labelledby="tab-llm-messages">
      <div
        class="llm-messages-panel"
        hx-get="/fragment/llm-messages"
        hx-trigger="load, every 4s"
        hx-swap="innerHTML"
        hx-on::after-settle="restoreLlmExpandedState()"
      ></div>
    </div>
    </main>


    <script src="/assets/dashboard-errors.js?v=1"></script>
    <script src="/assets/dashboard-action-area.js?v=1"></script>
    <script src="/assets/dashboard-story-log.js?v=1"></script>
    <script src="/assets/dashboard-slash-menu.js?v=1"></script>
    <script src="/assets/dashboard-panels.js?v=1"></script>
  </body>
</html>
