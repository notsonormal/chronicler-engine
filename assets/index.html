<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronicler Engine</title>
    <script src="/assets/htmx.min.js?v=1"></script>
    <script src="/assets/idiomorph-ext.min.js?v=1"></script>
    <link rel="stylesheet" href="/assets/styles.css?v=4" />
    <link rel="stylesheet" href="/assets/worlds.css?v=4" />
    <link rel="stylesheet" href="/assets/games.css?v=1" />
  </head>
  <body hx-ext="morph">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="error-notification" id="error-notification"></div>
    <div class="header-bar">
      <div
        class="header"
        id="header"
        hx-get="/fragment/header"
        hx-trigger="load, every 5s"
        hx-swap="innerHTML"
      ></div>
    </div>
    <div id="failure-banner" class="failure-banner" role="status" hidden>
      <div id="failure-banner-degraded" class="failure-banner-degraded"></div>
      <div id="failure-banner-unreachable" class="failure-banner-unreachable"></div>
    </div>
    <div class="tab-bar" role="tablist" aria-label="Dashboard sections">
      <button class="tab active" role="tab" id="tab-game" aria-controls="game-tab" aria-selected="true" data-tab="game">Game</button>
      <button class="tab" role="tab" id="tab-settings" aria-controls="settings-tab" aria-selected="false" data-tab="settings">Settings</button>
      <button class="tab" role="tab" id="tab-prompt-presets" aria-controls="prompt-presets-tab" aria-selected="false" data-tab="prompt-presets">Prompt Presets</button>
      <button class="tab" role="tab" id="tab-worlds" aria-controls="worlds-tab" aria-selected="false" data-tab="worlds">Worlds</button>
      <button class="tab" role="tab" id="tab-games" aria-controls="games-tab" aria-selected="false" data-tab="games">Games</button>
      <button class="tab" role="tab" id="tab-llm-messages" aria-controls="llm-messages-tab" aria-selected="false" data-tab="llm-messages">LLM Messages</button>
    </div>
    <main id="main-content" class="main-content" tabindex="-1">
    <div class="tab-content active" id="game-tab" role="tabpanel" aria-labelledby="tab-game">
      <div class="main-container">
        <div
          class="story-log"
          id="story-log"
          tabindex="0"
          aria-label="Story log"
          hx-get="/fragment/story-log"
          hx-trigger="load, every 2s"
          hx-swap="morph:innerHTML"
        ></div>
        <div
          class="visual-sidebar"
          hx-get="/fragment/visual-sidebar"
          hx-trigger="load, every 5s"
        ></div>
      </div>

      <!-- Static shell: the command form and status display survive every
           submit; the send preview and check result render in their own
           elements. -->
      <!-- Options dock: sibling bar above the action area (V4 shape); its
           inner content self-polls and is empty until options exist. -->
      <div
        id="options-dock"
        hx-get="/fragment/options-dock"
        hx-trigger="load, every 2s"
        hx-swap="innerHTML"
      ></div>
      <div class="action-area" id="action-area">
        <div id="action-preview" class="action-preview"></div>
        <form
          id="command-form"
          hx-post="/action/check"
          hx-target="#action-preview"
          hx-swap="innerHTML"
          hx-sync="this:drop"
          hx-on::before-request="onCommandBeforeRequest()"
          hx-on::after-request="onCommandAfterRequest()"
        >
          <label class="visually-hidden" for="command-input">Command</label>
          <input
            id="command-input"
            type="text"
            name="command"
            placeholder="Enter command..."
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="slash-menu"
            aria-autocomplete="list"
          />
          <button type="submit" id="submit-btn">
            <span class="btn-icon">&#9654;</span> Send
          </button>
          <div class="inline-error-slot" data-error-slot="action" hidden></div>
        </form>
        <div
          class="status ready"
          id="status-display"
          hx-get="/status/generating"
          hx-trigger="load, every 5s"
          hx-swap="innerHTML"
          hx-on::after-swap="onStatusPoll(this)"
        >
          <span class="status ready">Ready</span>
        </div>
        <div
          id="text-check-result"
          class="text-check-result"
          role="status"
          aria-live="polite"
        ></div>
      </div>
      <div
        id="restore-notice"
        class="restore-notice"
        role="status"
        aria-live="polite"
      ></div>
      <!-- Hidden live regions for the polled surfaces. Those containers are
           re-rendered wholesale each cycle, so a live region on them would
           re-announce unchanged content; these carry only what changed. -->
      <div
        id="narration-announcer"
        class="visually-hidden"
        role="status"
        aria-live="polite"
      ></div>
      <div
        id="options-announcer"
        class="visually-hidden"
        role="status"
        aria-live="polite"
      ></div>
      <div
        id="status-announcer"
        class="visually-hidden"
        role="status"
        aria-live="polite"
      ></div>
      <div
        id="status-error-announcer"
        class="visually-hidden"
        role="alert"
      ></div>
    </div>
    <div class="tab-content" id="settings-tab" role="tabpanel" aria-labelledby="tab-settings">
      <div
        class="settings-panel"
        hx-get="/fragment/settings"
        hx-trigger="load"
      ></div>
    </div>
    <div class="tab-content" id="prompt-presets-tab" role="tabpanel" aria-labelledby="tab-prompt-presets">
      <div
        class="prompt-presets-panel"
        hx-get="/fragment/prompt-presets"
        hx-trigger="load"
      ></div>
    </div>
    <div class="tab-content" id="worlds-tab" role="tabpanel" aria-labelledby="tab-worlds">
      <div
        class="worlds-panel"
        hx-get="/fragment/worlds"
        hx-trigger="load"
      ></div>
    </div>
    <div class="tab-content" id="games-tab" role="tabpanel" aria-labelledby="tab-games">
      <div
        class="games-panel"
        hx-get="/fragment/games"
        hx-trigger="load"
      ></div>
    </div>
    <div class="tab-content" id="llm-messages-tab" role="tabpanel" aria-labelledby="tab-llm-messages">
      <div
        class="llm-messages-panel"
        hx-get="/fragment/llm-messages"
        hx-trigger="load, every 4s"
        hx-swap="innerHTML"
        hx-on::after-settle="restoreLlmExpandedState()"
      ></div>
    </div>
    </main>


    <script>
      console.log("[HTMX] Initializing...");

      // Action-area state machine. The DOM holds every state except an
      // in-flight check request, so re-derive it after each swap or poll.
      let checkInFlight = false;

      function statusIsGenerating() {
        const statusDisplay = document.getElementById("status-display");
        return !!(statusDisplay && statusDisplay.querySelector(".status.thinking"));
      }

      function previewIsOpen() {
        const preview = document.getElementById("action-preview");
        return !!(preview && preview.firstElementChild !== null);
      }

      function deriveActionState() {
        if (checkInFlight) return "checking";
        if (statusIsGenerating()) return "generating";
        if (previewIsOpen()) return "preview";
        return "idle";
      }

      // The disabled button shows a generating indicator; it cannot cancel a turn.
      function applyActionState(state) {
        const btn = document.getElementById("submit-btn");
        const input = document.querySelector('#command-form input[name="command"]');
        if (btn) {
          if (state === "generating") {
            btn.innerHTML = '<span class="btn-icon">&#8230;</span> Generating…';
            btn.disabled = true;
          } else {
            btn.innerHTML = '<span class="btn-icon">&#9654;</span> Send';
            btn.disabled = state === "checking";
          }
        }
        if (input) {
          input.disabled = state === "checking";
        }
      }

      function focusCorrectedTextarea() {
        const textarea = document.getElementById("corrected-textarea");
        if (textarea) textarea.focus();
      }

      function focusCommandInput() {
        const input = commandInput();
        if (input) input.focus();
      }

      // Re-derive after a swap or poll. Focus follows the preview surface, so
      // it lands in the correction textarea even while a turn runs behind it.
      let previewWasOpen = false;

      function syncActionState() {
        applyActionState(deriveActionState());
        const open = previewIsOpen();
        if (open && !previewWasOpen) {
          focusCorrectedTextarea();
        } else if (!open && previewWasOpen) {
          focusCommandInput();
        }
        previewWasOpen = open;
      }

      // One writer for the status span: its label and class always travel together.
      function setStatus(label, statusClass) {
        const statusDisplay = document.getElementById("status-display");
        if (statusDisplay) {
          statusDisplay.innerHTML =
            '<span class="status ' + statusClass + '">' + label + "</span>";
        }
      }

      // The last error text the status display reported, so a poll that keeps
      // returning the same error toasts once, not every cycle.
      let lastStatusError = null;

      function writeLiveRegion(id, text) {
        const region = document.getElementById(id);
        if (!region || region.textContent === text) return;
        region.textContent = text;
      }

      let announcedStatusLabel = null;

      function announceStatusDisplay() {
        const statusDisplay = document.getElementById("status-display");
        if (!statusDisplay || statusDisplay.querySelector(".error-disclosure")) {
          return;
        }
        const label = statusDisplay.textContent.trim();
        if (label === "") return;
        if (announcedStatusLabel === null) {
          announcedStatusLabel = label;
          return;
        }
        if (label === announcedStatusLabel) return;
        announcedStatusLabel = label;
        writeLiveRegion("status-announcer", label);
      }

      function announceGenerationError(statusDisplay) {
        const message = statusDisplay.querySelector(".error-disclosure-message");
        writeLiveRegion(
          "status-error-announcer",
          message ? message.textContent.trim() : "",
        );
      }

      function applyStatusDisplay() {
        const statusDisplay = document.getElementById("status-display");
        if (!statusDisplay) return;
        syncActionState();
        const disclosure = statusDisplay.querySelector(".error-disclosure");
        if (disclosure) {
          const raw = statusDisplay.querySelector(".error-detail-raw");
          const text = (raw ? raw.textContent : disclosure.textContent).trim();
          if (text !== lastStatusError) {
            lastStatusError = text;
            showError("Error: " + text);
          }
        } else {
          lastStatusError = null;
        }
        announceGenerationError(statusDisplay);
        announceStatusDisplay();
      }

      let announcedEntryIds = null;

      function announceNewNarration() {
        const log = document.getElementById("story-log");
        if (!log) return;
        const entries = Array.from(log.querySelectorAll(".log-entry"));
        const ids = entries.map((entry) => entry.dataset.id);
        if (announcedEntryIds === null) {
          announcedEntryIds = new Set(ids);
          return;
        }
        const added = entries.filter(
          (entry) => !announcedEntryIds.has(entry.dataset.id),
        );
        announcedEntryIds = new Set(ids);
        const narration = added.filter((entry) =>
          entry.classList.contains("narration"),
        );
        if (narration.length === 0) return;
        writeLiveRegion(
          "narration-announcer",
          narration
            .map((entry) => {
              const text = entry.querySelector(".text");
              return text ? text.textContent.trim() : "";
            })
            .filter((text) => text.length > 0)
            .join("\n\n"),
        );
      }

      let announcedOptions = null;

      function announceOptions() {
        const dock = document.getElementById("options-dock");
        if (!dock) return;
        const options = Array.from(dock.querySelectorAll(".option-btn")).map(
          (btn) => btn.textContent.trim(),
        );
        if (announcedOptions === null) {
          announcedOptions = options;
          return;
        }
        const unchanged =
          options.length === announcedOptions.length &&
          options.every((option, index) => option === announcedOptions[index]);
        if (unchanged) return;
        announcedOptions = options;
        if (options.length === 0) return;
        writeLiveRegion(
          "options-announcer",
          options.length + " options available: " + options.join("; "),
        );
      }

      function updateToThinking() {
        setStatus("Thinking...", "thinking");
        applyStatusDisplay();
      }

      // /status/generating returns a bare phase name or "idle" as plain text,
      // or an error fragment, which stays in place for applyStatusDisplay.
      function onStatusPoll(el) {
        const text = el.textContent.trim();
        const phaseMap = {
          narrating: "Generating narration...",
          quantifying: "Quantifying scene...",
          "generating-event": "Generating event...",
          options: "Generating options...",
        };
        if (text === "idle") {
          setStatus("Ready", "ready");
        } else if (phaseMap[text]) {
          setStatus(phaseMap[text], "thinking");
        }
        applyStatusDisplay();
      }

      // Body-level, so no fragment swap replaces it.
      const errorNotification = document.getElementById("error-notification");

      // One pending clear per notice element, so a newer notice is never
      // wiped by an older notice's timer.
      const noticeClearTimers = new WeakMap();

      function scheduleNoticeClear(element, onClear, delayMs) {
        const pending = noticeClearTimers.get(element);
        if (pending !== undefined) clearTimeout(pending);
        noticeClearTimers.set(
          element,
          setTimeout(() => {
            noticeClearTimers.delete(element);
            onClear();
          }, delayMs)
        );
      }

      function showError(message) {
        if (!errorNotification) return;
        errorNotification.textContent = message;
        errorNotification.classList.add("visible");
        scheduleNoticeClear(
          errorNotification,
          () => errorNotification.classList.remove("visible"),
          5000
        );
      }

      // htmx:beforeSwap can cancel the swap; show the toast and let it proceed.
      document.body.addEventListener("htmx:beforeSwap", function (evt) {
        if (evt.detail.isError) {
          const response = evt.detail.serverResponse || "";
          const text = response.replace(/<[^>]*>/g, "").trim();
          showError(text || "Request failed");
        }
      });

      // Unreachable is assertive; a degraded-role banner alone stays polite.
      function refreshFailureBanner() {
        const banner = document.getElementById("failure-banner");
        const degraded = document.getElementById("failure-banner-degraded");
        const unreachable = document.getElementById("failure-banner-unreachable");
        if (!banner) return;
        const degradedUp = !!degraded && degraded.innerHTML.trim() !== "";
        const unreachableUp = !!unreachable && unreachable.innerHTML.trim() !== "";
        banner.hidden = !(degradedUp || unreachableUp);
        banner.classList.toggle("unreachable", unreachableUp);
        banner.setAttribute("role", unreachableUp ? "alert" : "status");
      }

      function markUnreachable() {
        const unreachable = document.getElementById("failure-banner-unreachable");
        if (!unreachable) return;
        if (unreachable.innerHTML.trim() === "") {
          unreachable.innerHTML =
            '<div class="error-disclosure">' +
            '<span class="error-disclosure-message">The engine is unreachable. Nothing you do is being saved.</span>' +
            "</div>";
        }
        refreshFailureBanner();
      }

      function clearUnreachable() {
        const unreachable = document.getElementById("failure-banner-unreachable");
        if (!unreachable || unreachable.innerHTML.trim() === "") return;
        unreachable.innerHTML = "";
        refreshFailureBanner();
      }

      function escapeHtml(value) {
        const entities = {
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#x27;",
        };
        return String(value).replace(/[&<>"']/g, (ch) => entities[ch]);
      }

      // Mirrors the server's disclosure shape for a request with no response body.
      function errorDisclosureHtml(popoverId, message, rawText) {
        return (
          '<div class="error-disclosure">' +
          '<span class="error-disclosure-message">' + escapeHtml(message) + "</span>" +
          '<button type="button" class="error-details-toggle" aria-expanded="false" aria-controls="' +
          escapeHtml(popoverId) + '">Details</button>' +
          '<div class="error-detail-popover" id="' + escapeHtml(popoverId) + '" hidden>' +
          '<pre class="error-detail-raw">' + escapeHtml(rawText) + "</pre></div></div>"
        );
      }

      const INLINE_ERROR_CONTAINERS =
        "form, .settings-card, .world-item, .preset-card, .game-item, .llm-message-card";

      function inlineErrorSlotFor(elt) {
        if (!elt || !elt.closest) return null;
        const container = elt.closest(INLINE_ERROR_CONTAINERS);
        return container ? container.querySelector("[data-error-slot]") : null;
      }

      function renderInlineError(slot, message, rawText) {
        if (!slot) return;
        const id = slot.dataset.errorSlot || "inline-error";
        slot.innerHTML = errorDisclosureHtml(id + "-popover", message, rawText);
        slot.hidden = false;
      }

      function plainResponseText(xhr) {
        const body = xhr ? xhr.responseText || "" : "";
        return body.replace(/<[^>]*>/g, "").trim();
      }

      // A polled container carries `every` in `hx-trigger`. Only a poll's
      // failure implies unreachability: a server that answered is reachable,
      // so a failed action reports on its own surface instead.
      function isPollRequest(elt) {
        if (!elt || !elt.getAttribute) return false;
        const trigger = elt.getAttribute("hx-trigger") || "";
        return trigger.includes("every");
      }

      document.body.addEventListener("htmx:responseError", function (evt) {
        const slot = inlineErrorSlotFor(evt.detail.elt);
        if (slot) {
          renderInlineError(slot, "That action failed.", plainResponseText(evt.detail.xhr));
        } else if (isPollRequest(evt.detail.elt)) {
          markUnreachable();
        }
      });

      document.body.addEventListener("htmx:sendError", function (evt) {
        markUnreachable();
        const slot = inlineErrorSlotFor(evt.detail.elt);
        if (slot) {
          renderInlineError(slot, "The engine is unreachable.", "No response from the server.");
        }
      });

      document.body.addEventListener("htmx:afterRequest", function (evt) {
        if (!evt.detail.successful) return;
        clearUnreachable();
        const slot = inlineErrorSlotFor(evt.detail.elt);
        if (slot) {
          slot.innerHTML = "";
          slot.hidden = true;
        }
      });

      document.body.addEventListener("htmx:afterSettle", refreshFailureBanner);

      // The disclosure a swap may replace while it is open. The swap replaces
      // the node, which would collapse it and drop focus, so this record reopens
      // it after a swap that keeps the disclosure in the DOM.
      let openErrorDetails = null;

      function closeErrorPopover(popover) {
        if (!popover) return;
        popover.classList.remove("open");
        popover.hidden = true;
        if (openErrorDetails && openErrorDetails.popoverId === popover.id) {
          openErrorDetails = null;
        }
        const toggle = document.querySelector(
          '.error-details-toggle[aria-controls="' + popover.id + '"]',
        );
        if (toggle) toggle.setAttribute("aria-expanded", "false");
      }

      function rememberOpenErrorDetails(popover, toggle) {
        openErrorDetails = {
          popoverId: popover.id,
          hadFocus: document.activeElement === toggle,
        };
      }

      function restoreOpenErrorDetails() {
        if (!openErrorDetails) return;
        const popover = document.getElementById(openErrorDetails.popoverId);
        const toggle = document.querySelector(
          '.error-details-toggle[aria-controls="' + openErrorDetails.popoverId + '"]',
        );
        if (!popover || !toggle) {
          openErrorDetails = null;
          return;
        }
        popover.classList.add("open");
        popover.hidden = false;
        toggle.setAttribute("aria-expanded", "true");
        const focusFell =
          !document.activeElement || document.activeElement === document.body;
        if (openErrorDetails.hadFocus && focusFell) toggle.focus();
        positionErrorPopover(popover, toggle);
      }

      function closeAllErrorPopovers() {
        document.querySelectorAll(".error-detail-popover.open").forEach(closeErrorPopover);
      }

      function positionErrorPopover(popover, toggle) {
        const rect = toggle.getBoundingClientRect();
        popover.style.left = Math.max(8, rect.left) + "px";
        const spaceBelow = window.innerHeight - rect.bottom;
        if (spaceBelow < 220) {
          popover.style.bottom = window.innerHeight - rect.top + 6 + "px";
          popover.style.top = "";
        } else {
          popover.style.top = rect.bottom + 6 + "px";
          popover.style.bottom = "";
        }
      }

      document.addEventListener("click", function (evt) {
        const target = evt.target;
        if (!(target instanceof HTMLElement)) return;
        const toggle = target.closest(".error-details-toggle");
        if (toggle) {
          const popover = document.getElementById(toggle.getAttribute("aria-controls"));
          if (popover) {
            const open = popover.classList.toggle("open");
            popover.hidden = !open;
            toggle.setAttribute("aria-expanded", String(open));
            if (open) {
              positionErrorPopover(popover, toggle);
              rememberOpenErrorDetails(popover, toggle);
            } else {
              closeErrorPopover(popover);
            }
          }
          return;
        }
        if (!target.closest(".error-detail-popover")) closeAllErrorPopovers();
      });

      document.addEventListener("keydown", function (evt) {
        if (evt.key === "Escape") closeAllErrorPopovers();
      });

      window.addEventListener("resize", closeAllErrorPopovers);
      window.addEventListener("scroll", closeAllErrorPopovers, true);

      // A swap that replaces an open disclosure must not close it; `afterSettle`
      // sees the final DOM after out-of-band processing.
      document.body.addEventListener("htmx:afterSwap", restoreOpenErrorDetails);
      document.body.addEventListener("htmx:afterSettle", restoreOpenErrorDetails);

      document.body.addEventListener("htmx:afterSwap", function (evt) {
        syncActionState();
        const target = evt.detail && (evt.detail.target || evt.detail.elt);
        if (!target || !target.id) return;
        if (target.id === "story-log") {
          announceNewNarration();
        } else if (target.id === "options-dock") {
          announceOptions();
        }
      });

      // Focus policy across in-place swaps. A control that survives the swap in
      // equivalent form carries a stable id, so htmx restores focus to it (the
      // posture selects, the LLM row header, the log entry's edit button). A
      // control replaced by a *different* control (Edit to form, Cancel to
      // list) cannot use an id, so this manager moves focus to the first usable
      // control in the swapped region.
      const FOCUS_SWAP_TARGETS = ".worlds-panel, .prompt-presets-panel, .preset-card";
      const FOCUSABLE = "input:not([type=hidden]), select, textarea, button, a[href]";
      let focusedBeforeSwap = null;

      document.body.addEventListener("htmx:beforeSwap", function () {
        focusedBeforeSwap = document.activeElement;
      });

      document.body.addEventListener("htmx:afterSettle", function (evt) {
        const saved = focusedBeforeSwap;
        focusedBeforeSwap = null;
        if (!saved || saved === document.body || document.contains(saved)) return;
        if (document.activeElement && document.activeElement !== document.body) return;
        const target = evt.detail.elt;
        if (!target || !target.matches || !target.matches(FOCUS_SWAP_TARGETS)) return;
        for (const next of target.querySelectorAll(FOCUSABLE)) {
          if (!next.disabled) {
            next.focus();
            return;
          }
        }
      });

      // One bundle for the edit in progress: the entry id and the pre-edit HTML
      // each revert restores. Null means no edit is active.
      let editState = null;
      let originalTrigger = null;

      function pausePolling() {
        const storyLog = document.getElementById("story-log");
        if (storyLog) {
          // Save the real trigger once. A second pause must not overwrite it
          // with "none", or the resumed poll never comes back.
          if (originalTrigger === null) {
            originalTrigger = storyLog.getAttribute("hx-trigger");
          }
          storyLog.setAttribute("hx-trigger", "none");
          htmx.process(storyLog);
        }
      }

      function resumePolling() {
        const storyLog = document.getElementById("story-log");
        if (storyLog && originalTrigger) {
          storyLog.setAttribute("hx-trigger", originalTrigger);
          htmx.process(storyLog);
          originalTrigger = null;
        }
      }

      function autoResizeTextarea(textarea) {
        textarea.style.height = "auto";
        // `box-sizing: border-box` makes `height` include the border, so add
        // it back or the content overflows by the border width and the
        // textarea grows its own scrollbar even when it is big enough.
        const border = textarea.offsetHeight - textarea.clientHeight;
        textarea.style.height = textarea.scrollHeight + border + "px";
      }

      function lockOtherEditButtons() {
        document.querySelectorAll("#story-log .edit-btn").forEach((btn) => {
          btn.disabled = true;
        });
      }

      function unlockEditButtons() {
        document.querySelectorAll("#story-log .edit-btn").forEach((btn) => {
          btn.disabled = false;
        });
      }

      function showEditForm(id) {
        if (editState !== null) return;
        editState = { id: id, text: null, actions: null, swipeControls: null };
        const entry = document.querySelector(`[data-id="${id}"]`);
        if (entry) {
          const textSpan = entry.querySelector(".text");

          // data-raw-text holds the pre-markdown source; .text is rendered.
          const rawText = entry.getAttribute("data-raw-text") || "";
          editState.text = textSpan.innerHTML;

          textSpan.innerHTML = "";
          const textarea = document.createElement("textarea");
          textarea.id = "edit-textarea";
          textarea.className = "edit-textarea";
          textarea.textContent = rawText;
          textSpan.appendChild(textarea);
          autoResizeTextarea(textarea);

          textarea.addEventListener("input", function () {
            autoResizeTextarea(this);
          });
          textarea.addEventListener("keydown", function (evt) {
            if (evt.key === "Escape") {
              evt.preventDefault();
              cancelEdit();
            } else if (evt.key === "Enter" && (evt.ctrlKey || evt.metaKey)) {
              evt.preventDefault();
              submitEdit();
            }
          });

          // Lock the entry while editing: the action cluster becomes
          // save/cancel, and the swipe controls stay put but stop responding.
          const actionsContainer = entry.querySelector(".message-actions");
          if (actionsContainer) {
            editState.actions = actionsContainer.innerHTML;
            actionsContainer.innerHTML = `<button class="save-btn" onclick="submitEdit()" title="Save">✓</button><button class="cancel-btn" onclick="cancelEdit()" title="Cancel">✗</button>`;
          }
          const swipeControls = entry.querySelector(".swipe-controls");
          if (swipeControls) {
            editState.swipeControls = swipeControls.innerHTML;
            swipeControls.querySelectorAll(".action-btn").forEach((btn) => {
              btn.disabled = true;
            });
          }

          lockOtherEditButtons();
          pausePolling();
          textarea.focus();
        }
      }

      function clearEditState() {
        editState = null;
      }

      function revertEdit() {
        if (editState === null) return;
        const entry = document.querySelector(`[data-id="${editState.id}"]`);
        if (entry) {
          const textSpan = entry.querySelector(".text");
          textSpan.innerHTML = editState.text;
          const actionsContainer = entry.querySelector(".message-actions");
          if (actionsContainer && editState.actions !== null) {
            actionsContainer.innerHTML = editState.actions;
          }
          const swipeControls = entry.querySelector(".swipe-controls");
          if (swipeControls && editState.swipeControls !== null) {
            swipeControls.innerHTML = editState.swipeControls;
          }
        }
        clearEditState();
        unlockEditButtons();
      }

      function cancelEdit() {
        if (editState === null) return;
        const entryId = editState.id;
        revertEdit();
        resumePolling();
        const entry = document.querySelector(`[data-id="${entryId}"]`);
        const editBtn = entry ? entry.querySelector(".edit-btn") : null;
        if (editBtn) editBtn.focus();
      }

      function submitEdit() {
        if (editState === null) return;
        const newText = document.getElementById("edit-textarea").value;
        const formData = new URLSearchParams();
        formData.append("text", newText);
        // editState stays set until the outcome is known, so a failure can
        // restore the entry instead of stranding it in edit mode.
        fetch(`/history/${editState.id}`, {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData,
        })
          .then((response) => {
            if (!response.ok) {
              throw new Error(`save failed with status ${response.status}`);
            }
            // The lock stays until the resumed poll replaces the entry's
            // controls, so a second editor cannot open on a stale textarea.
            clearEditState();
          })
          .catch((err) => {
            console.error("Failed to save message:", err);
            showError("Failed to save message");
            revertEdit();
          })
          .finally(() => {
            // Both outcomes must unpause the log, or it freezes on a failure.
            resumePolling();
          });
      }

      // Raw-fetch failures have no htmx swap to restore the status display;
      // without this it stays on "Thinking..." with the button stuck as a
      // generating indicator.
      function resetStatusToReady() {
        setStatus("Ready", "ready");
        applyStatusDisplay();
      }

      // Clears the posture group's "Saved" confirmation, so a failed Update
      // World cannot sit under green feedback from an earlier auto-save.
      function clearPostureStatus() {
        const status = document.getElementById("world-posture-status");
        if (status) status.innerHTML = "";
      }

      // Retry/retrigger run through raw fetch, so a failed request reports its
      // own error and resets the status the htmx swaps would otherwise restore.
      function submitGenerationRequest(url, failureMessage) {
        updateToThinking();
        fetch(url, { method: "POST" })
          .then((response) => {
            if (!response.ok) {
              throw new Error(`${failureMessage} (status ${response.status})`);
            }
            return response.text();
          })
          .catch((err) => {
            console.error(`${failureMessage}:`, err);
            showError(failureMessage);
            resetStatusToReady();
          });
      }

      function submitNewSwipe() {
        submitGenerationRequest("/swipe/new", "Failed to generate a new swipe");
      }

      function submitRetrigger() {
        submitGenerationRequest("/retrigger", "Failed to retrigger the event");
      }

      // A restored swipe has no state signal of its own — the counter alone
      // does not tell the player a snapshot was restored.
      function announceSwipeRestore() {
        const notice = document.getElementById("restore-notice");
        if (!notice) return;
        const counter = document.querySelector("#story-log .swipe-counter");
        const label = counter ? counter.textContent.trim() : "";
        notice.textContent = label ? `Restored swipe ${label}` : "Swipe restored";
        scheduleNoticeClear(notice, () => {
          notice.textContent = "";
        }, 4000);
      }

      function switchSwipe(messageId, index) {
        fetch(`/message/${messageId}/swipe/${index}`, { method: "POST" })
          .then((response) => {
            if (response.ok) {
              return response.text();
            }
            throw new Error("Swipe switch failed");
          })
          .then((html) => {
            document.getElementById("story-log").innerHTML = html;
            // The restore is a settled state: drop any stale generating label
            // at once rather than waiting for the next 5s status poll.
            resetStatusToReady();
            announceSwipeRestore();
          })
          .catch((err) => {
            console.error("Swipe switch failed:", err);
            showError("Failed to switch swipe");
          });
      }

      function deleteMessage() {
        if (!confirm("Delete this message?")) return;
        fetch("/history/delete", { method: "POST" })
          .then((response) => {
            if (response.ok) {
              htmx.ajax("GET", "/fragment/story-log", {
                target: "#story-log",
                swap: "innerHTML",
              });
            } else {
              response.text().then((text) => showError(text));
            }
          })
          .catch((err) => {
            console.error("Delete failed:", err);
            showError("Failed to delete message");
          });
      }

      function onCommandBeforeRequest() {
        checkInFlight = true;
        syncActionState();
      }

      function onCommandAfterRequest() {
        checkInFlight = false;
        // The preview keeps the flagged command for editing; a dispatched
        // command has been consumed, so clear the input.
        if (!previewIsOpen()) {
          const form = document.getElementById("command-form");
          if (form) form.reset();
        }
        syncActionState();
      }

      // Closing the preview lets the already-swapped status display and the
      // reconciler drive the rest.
      function closeActionPreview() {
        const preview = document.getElementById("action-preview");
        if (preview) preview.innerHTML = "";
        syncActionState();
      }

      // An option is a pre-written player input: Use submits it through
      // /action/check, Edit copies it into the input for editing.
      function useOption(btn) {
        const input = commandInput();
        // A generation in flight owns the input: a stale option left over from
        // the previous turn must not hijack it. `input.disabled` alone misses
        // this — the input is only disabled while a text check is in flight.
        if (!input || input.disabled || statusIsGenerating()) return;
        input.value = btn.textContent;
        document.getElementById("command-form").requestSubmit();
      }

      function editOption(btn) {
        const input = commandInput();
        if (!input || input.disabled) return;
        const optionBtn = btn.closest(".option-item").querySelector(".option-btn");
        input.value = optionBtn.textContent;
        input.focus();
      }

      function checkCurrentInput() {
        const input = document.querySelector(
          '#command-form input[name="command"]',
        );
        if (!input || !input.value.trim()) return;
        checkText(input.value.trim(), null);
      }

      function htmlUnescape(str) {
        const textarea = document.createElement("textarea");
        textarea.innerHTML = str;
        return textarea.value;
      }

      function checkText(text, entryId) {
        const formData = new URLSearchParams();
        formData.append("command", text);
        if (entryId !== undefined && entryId !== null && entryId !== "") {
          formData.append("entry_id", String(entryId));
        }

        fetch("/check-text", {
          method: "POST",
          headers: { "Content-Type": "application/x-www-form-urlencoded" },
          body: formData,
        })
          .then((response) => response.text())
          .then((html) => {
            const result = document.getElementById("text-check-result");
            if (result) {
              result.innerHTML = html;
              htmx.process(result);
            }
          })
          .catch((err) => {
            console.error("Text check failed:", err);
            clearTextCheckResult();
          });
      }

      function checkLogText(rawText, entryId) {
        checkText(htmlUnescape(rawText), entryId);
      }

      function clearTextCheckResult() {
        const result = document.getElementById("text-check-result");
        if (result) {
          result.innerHTML = "";
        }
      }

      const SLASH_COMMANDS = [
        { cmd: "/impersonate", desc: "Write as the player persona" },
        { cmd: "/guide", desc: "Steer the next generation (Guided Generation)" },
        { cmd: "/options", desc: "Suggest actions (generate pickable options)" },
      ];
      let slashMenu = null;
      let slashMatches = [];
      let slashActiveIndex = -1;

      function commandInput() {
        return document.querySelector('#command-form input[name="command"]');
      }

      function closeSlashMenu() {
        if (slashMenu) {
          slashMenu.remove();
          slashMenu = null;
        }
        slashMatches = [];
        slashActiveIndex = -1;
        const input = commandInput();
        if (input) {
          input.setAttribute("aria-expanded", "false");
          input.removeAttribute("aria-activedescendant");
        }
      }

      function slashMatchesFor(value) {
        const v = value.trimStart();
        if (!v.startsWith("/")) return [];
        return SLASH_COMMANDS.filter((c) => c.cmd.startsWith(v));
      }

      function positionSlashMenu(input) {
        if (!slashMenu) return;
        const rect = input.getBoundingClientRect();
        slashMenu.style.left = rect.left + "px";
        slashMenu.style.bottom = window.innerHeight - rect.top + 4 + "px";
      }

      function renderSlashMenu(input) {
        if (slashMatches.length === 0) {
          closeSlashMenu();
          return;
        }
        if (!slashMenu) {
          slashMenu = document.createElement("div");
          slashMenu.className = "slash-menu";
          slashMenu.id = "slash-menu";
          slashMenu.setAttribute("role", "listbox");
          slashMenu.setAttribute("aria-label", "Slash commands");
          document.body.appendChild(slashMenu);
        }
        slashMenu.innerHTML = "";
        slashMatches.forEach((m, i) => {
          const item = document.createElement("div");
          item.className = "slash-suggestion" + (i === slashActiveIndex ? " active" : "");
          item.id = "slash-option-" + i;
          item.setAttribute("role", "option");
          item.setAttribute("aria-selected", i === slashActiveIndex ? "true" : "false");
          item.dataset.cmd = m.cmd;
          const cmdSpan = document.createElement("span");
          cmdSpan.className = "slash-cmd";
          cmdSpan.textContent = m.cmd;
          const descSpan = document.createElement("span");
          descSpan.className = "slash-desc";
          descSpan.textContent = m.desc;
          item.appendChild(cmdSpan);
          item.appendChild(descSpan);
          slashMenu.appendChild(item);
        });
        positionSlashMenu(input);
        input.setAttribute("aria-expanded", "true");
        syncSlashActiveDescendant(input);
      }

      // The combobox points at the active option; the option keeps its visual
      // highlight class and mirrors it into `aria-selected`.
      function syncSlashActiveDescendant(input) {
        if (slashActiveIndex >= 0 && slashMenu) {
          input.setAttribute("aria-activedescendant", "slash-option-" + slashActiveIndex);
        } else {
          input.removeAttribute("aria-activedescendant");
        }
      }

      function openSlashMenu(input) {
        slashMatches = slashMatchesFor(input.value);
        slashActiveIndex = slashMatches.length > 0 ? 0 : -1;
        renderSlashMenu(input);
      }

      function selectSlash(cmd, input) {
        input.value = cmd + " ";
        input.focus();
        const len = input.value.length;
        input.setSelectionRange(len, len);
        closeSlashMenu();
      }

      function setSlashActive(index) {
        slashActiveIndex = index;
        if (slashMenu) {
          slashMenu.querySelectorAll(".slash-suggestion").forEach((el, i) => {
            el.classList.toggle("active", i === slashActiveIndex);
            el.setAttribute("aria-selected", i === slashActiveIndex ? "true" : "false");
          });
        }
        const input = commandInput();
        if (input) syncSlashActiveDescendant(input);
      }

      document.addEventListener("input", function (e) {
        const input = e.target;
        if (!(input instanceof HTMLElement)) return;
        if (!input.matches('#command-form input[name="command"]')) return;
        openSlashMenu(input);
      });

      document.addEventListener("keydown", function (e) {
        const input = commandInput();
        if (!input || e.target !== input) return;
        if (!slashMenu) return;
        if (e.key === "ArrowDown") {
          e.preventDefault();
          if (slashMatches.length > 0) {
            setSlashActive((slashActiveIndex + 1) % slashMatches.length);
          }
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (slashMatches.length > 0) {
            setSlashActive((slashActiveIndex - 1 + slashMatches.length) % slashMatches.length);
          }
        } else if (e.key === "Enter") {
          if (slashMatches.length > 0 && slashActiveIndex >= 0) {
            e.preventDefault();
            selectSlash(slashMatches[slashActiveIndex].cmd, input);
          } else {
            closeSlashMenu();
          }
        } else if (e.key === "Escape") {
          e.preventDefault();
          closeSlashMenu();
        }
      });

      // mousedown on a suggestion selects (fires before the input blurs).
      document.addEventListener("mousedown", function (e) {
        const target = e.target;
        if (!(target instanceof HTMLElement)) return;
        const item = target.closest(".slash-suggestion");
        if (item && slashMenu && slashMenu.contains(item)) {
          e.preventDefault();
          const input = commandInput();
          if (input) selectSlash(item.dataset.cmd, input);
          return;
        }
        if (slashMenu && !slashMenu.contains(target) && target !== commandInput()) {
          closeSlashMenu();
        }
      });

      // focusout bubbles, so one document listener covers input blur.
      document.addEventListener("focusout", function (e) {
        if (!slashMenu) return;
        if (e.target === commandInput()) {
          setTimeout(() => {
            if (commandInput() !== document.activeElement && slashMenu) {
              closeSlashMenu();
            }
          }, 150);
        }
      });

      // Close on form submit, so the suggestion menu does not outlive the
      // command.
      document.addEventListener("submit", closeSlashMenu, true);

      // Close on scroll/resize — the fixed position is stale once the
      // viewport moves.
      window.addEventListener("scroll", closeSlashMenu, true);
      window.addEventListener("resize", closeSlashMenu);

      document.addEventListener("DOMContentLoaded", function () {
        // A page loaded mid-generation renders a thinking status span; the
        // reconciler locks Send and reads any error the span already carries.
        applyStatusDisplay();

        document.querySelectorAll(".tab").forEach((btn) => {
          btn.addEventListener("click", () => {
            document.querySelectorAll(".tab").forEach((b) => {
              b.classList.remove("active");
              b.setAttribute("aria-selected", b === btn ? "true" : "false");
            });
            document
              .querySelectorAll(".tab-content")
              .forEach((c) => c.classList.remove("active"));
            btn.classList.add("active");
            document
              .getElementById(btn.dataset.tab + "-tab")
              .classList.add("active");
          });
        });

        // Expansion state lives in JS: htmx polls re-render the panel.
        const expandedLlmMessages = new Set();
        let llmOriginalTrigger = null;

        function pauseLlmPolling() {
          const panel = document.querySelector(".llm-messages-panel");
          if (panel) {
            llmOriginalTrigger = panel.getAttribute("hx-trigger");
            panel.setAttribute("hx-trigger", "none");
            htmx.process(panel);
          }
        }

        function resumeLlmPolling() {
          const panel = document.querySelector(".llm-messages-panel");
          if (panel && llmOriginalTrigger) {
            panel.setAttribute("hx-trigger", llmOriginalTrigger);
            htmx.process(panel);
            llmOriginalTrigger = null;
          }
        }

        window.toggleLlmMessage = function (header) {
          const card = header.closest(".llm-message-card");
          if (card) {
            const expanded = card.classList.toggle("expanded");
            header.setAttribute("aria-expanded", String(expanded));
            const msgId = card.id;
            if (msgId) {
              if (expanded) {
                expandedLlmMessages.add(msgId);
                pauseLlmPolling();
              } else {
                expandedLlmMessages.delete(msgId);
                if (expandedLlmMessages.size === 0) {
                  resumeLlmPolling();
                }
              }
            }
          }
        };

        window.restoreLlmExpandedState = function () {
          expandedLlmMessages.forEach(function (msgId) {
            const card = document.getElementById(msgId);
            if (card) {
              card.classList.add("expanded");
              const header = card.querySelector(".llm-message-header");
              if (header) header.setAttribute("aria-expanded", "true");
            } else {
              expandedLlmMessages.delete(msgId);
            }
          });
        };


      });
    </script>
  </body>
</html>
