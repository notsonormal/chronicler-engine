<!doctype html>
<html lang="en" data-poll-ms="1000">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chronicler Engine</title>
    <script src="/assets/htmx.min.js?v=1"></script>
    <script src="/assets/idiomorph-ext.min.js?v=1"></script>
    <link rel="stylesheet" href="/assets/styles.css?v=25" />

    <link rel="stylesheet" href="/assets/games.css?v=6" />
  </head>
  <body>

    <a class="skip-link" href="#main-content">Skip to content</a>
    <div class="header-bar">
      <div class="header" id="header" data-part="header"></div>
    </div>
    <div id="failure-banner" class="failure-banner" role="status" hidden>
      <div
        id="failure-banner-degraded"
        class="failure-banner-degraded"
        data-part="failure-banner"
      ></div>
      <div id="failure-banner-unreachable" class="failure-banner-unreachable"></div>
    </div>
    <!-- The notice place, outside the parts: a report here leaves the parts' content alone. -->
    <div id="notice" class="notice" role="alert" hidden>
      <div class="notice-report" data-error-slot="notice" data-report></div>
      <button type="button" class="notice-close" data-close-notice aria-label="Close the notice">
        <svg class="icon" aria-hidden="true"><use href="#i-x"></use></svg>
      </button>
    </div>
    <div class="tab-bar" role="tablist" aria-label="Dashboard sections">
      <button class="tab active" role="tab" id="tab-game" aria-controls="game-tab" aria-selected="true" data-tab="game">Game</button>
      <button class="tab" role="tab" id="tab-settings" aria-controls="settings-tab" aria-selected="false" data-tab="settings">Settings</button>
      <button class="tab" role="tab" id="tab-prompt-presets" aria-controls="prompt-presets-tab" aria-selected="false" data-tab="prompt-presets">Prompt Presets</button>
      <button class="tab" role="tab" id="tab-worlds" aria-controls="worlds-tab" aria-selected="false" data-tab="worlds">Worlds</button>
      <button class="tab" role="tab" id="tab-games" aria-controls="games-tab" aria-selected="false" data-tab="games">Games</button>
      <button class="tab" role="tab" id="tab-llm-messages" aria-controls="llm-messages-tab" aria-selected="false" data-tab="llm-messages">LLM Messages</button>
    </div>
    <main id="main-content" class="main-content" tabindex="-1">
    <div class="tab-content active" id="game-tab" role="tabpanel" aria-labelledby="tab-game">
      <div class="main-container">
        <div
          class="story-log"
          id="story-log"
          tabindex="0"
          aria-label="Story log"
          data-part="story-log"
        ></div>
        <div class="visual-sidebar" data-part="visual-sidebar"></div>
      </div>

      <div id="options-dock" data-part="options-dock"></div>
      <div class="action-area" id="action-area">
        <div id="action-preview" class="action-preview"></div>
        <form
          id="command-form"
          hx-post="/action/check"
          hx-target="#action-preview"
          hx-swap="innerHTML"
          hx-sync="this:drop"
          hx-disabled-elt="#command-input"
          hx-on::before-request="onCommandBeforeRequest()"
          hx-on::after-request="onCommandAfterRequest(event)"
          hx-on::on-load-error="onCommandLoadError()"
        >
          <label class="visually-hidden" for="command-input">Action</label>
          <input
            id="command-input"
            type="text"
            name="command"
            placeholder="Enter an action..."
            autocomplete="off"
            role="combobox"
            aria-expanded="false"
            aria-controls="slash-menu"
            aria-autocomplete="list"
          />
          <div class="inline-error-slot" data-error-slot="action" hidden></div>
        </form>
        <!-- Send: the server renders its disabled state. Send submits the command form through its form attribute. -->
        <div id="send-control" data-part="send-control"></div>
        <form
          id="autoplay-form"
          hx-post="/autoplay"
          hx-swap="none"
          hx-sync="this:drop"
          hx-disabled-elt="#autoplay-cycles"
          hx-on::after-request="onAutoplayAfterRequest(event)"
        >
          <label class="visually-hidden" for="autoplay-cycles">Autoplay cycles</label>
          <input
            id="autoplay-cycles"
            type="number"
            name="cycles"
            value="10"
            min="1"
            max="100"
            step="1"
            title="Cycles to play"
          />
          <div class="inline-error-slot" data-error-slot="autoplay" hidden></div>
        </form>
        <!-- Autoplay and Stop: the server renders their disabled state. Autoplay submits the Autoplay form through its form attribute. -->
        <div id="autoplay-controls" data-part="autoplay-controls"></div>
        <!-- The action area's own state, next to the live status display that it never writes. -->
        <div class="status thinking" id="action-status"></div>
        <div
          class="status"
          id="status-display"
          data-part="status-display"
        ></div>
      </div>
      <div
        id="restore-notice"
        class="restore-notice"
        role="status"
        aria-live="polite"
      ></div>
      <!-- Separate regions so a load does not re-announce unchanged content. -->
      <div
        id="narration-announcer"
        class="visually-hidden"
        role="status"
        aria-live="polite"
      ></div>
      <div
        id="options-announcer"
        class="visually-hidden"
        role="status"
        aria-live="polite"
      ></div>
      <div
        id="status-announcer"
        class="visually-hidden"
        role="status"
        aria-live="polite"
      ></div>
      <div
        id="status-error-announcer"
        class="visually-hidden"
        role="alert"
      ></div>
    </div>
    <div class="tab-content" id="settings-tab" role="tabpanel" aria-labelledby="tab-settings">
      <div class="settings-panel" data-part="settings"></div>
    </div>
    <div class="tab-content" id="prompt-presets-tab" role="tabpanel" aria-labelledby="tab-prompt-presets">
      <div class="prompt-presets-panel" data-part="prompt-presets"></div>
    </div>
    <div class="tab-content" id="worlds-tab" role="tabpanel" aria-labelledby="tab-worlds">
      <div class="worlds-panel" data-part="worlds"></div>
    </div>
    <div class="tab-content" id="games-tab" role="tabpanel" aria-labelledby="tab-games">
      <div class="games-panel" data-part="games"></div>
    </div>
    <div class="tab-content" id="llm-messages-tab" role="tabpanel" aria-labelledby="tab-llm-messages">
      <div class="llm-messages-panel" data-part="llm-messages"></div>
    </div>
    </main>
    <dialog id="edit-dialog" aria-labelledby="edit-dialog-title">
      <div id="edit-dialog-body"></div>
      <div id="edit-dialog-status" class="edit-dialog-status" role="status"></div>
    </dialog>


    <script src="/assets/dashboard-errors.js?v=16"></script>
    <script src="/assets/dashboard-screen.js?v=10"></script>
    <script src="/assets/dashboard-saves.js?v=5"></script>
    <script src="/assets/dashboard-action-area.js?v=17"></script>
    <script src="/assets/dashboard-story-log.js?v=14"></script>
    <script src="/assets/dashboard-slash-menu.js?v=1"></script>
    <script src="/assets/dashboard-panels.js?v=9"></script>
    <script src="/assets/dashboard-dialog.js?v=12"></script>
  </body>
</html>
