# The mutants of the gate model. Each mutant mirrors one break of the code: it replaces
# the text `old` of VerifyGate.tla with `new`, and runs TLC on `config`. TLC stops at the
# first break, so the mutant passes when one of the rules in `breaks` breaks first.
# `without` takes rules out of the config of the mutant, so that a rule behind another
# rule can show. `python3 check.py --mutants` runs them all. A mutant that breaks none
# of its rules shows a rule that cannot fail: the rule or the model is wrong.
#
# A `fix` mutant is the other way around: it mirrors a fix of a known finding, and its
# config must then hold.

[[mutant]]
name = "accept-without-busy-check"
code = "GameWriter::accept with no require_idle"
config = "jobs"
breaks = ["OneJob", "BusyRefusesStory"]
old = '''
  /\ nextJob \in JobIds
  /\ holder[g].kind = "none"                         \* `require_idle`'''
new = '''
  /\ nextJob \in JobIds'''

[[mutant]]
name = "edit-without-busy-check"
code = "GameWriter::edit with no require_idle"
config = "jobs"
breaks = ["BusyRefusesStory"]
old = '''
YouEditAMessage(g) ==
  /\ "story" \in Env
  /\ g \in exists
  /\ holder[g].kind = "none"                         \* `require_idle`'''
new = '''
YouEditAMessage(g) ==
  /\ "story" \in Env
  /\ g \in exists'''

[[mutant]]
name = "swipe-switch-without-busy-check"
code = "GameWriter::switch_swipe with no require_idle"
config = "runs"
breaks = ["BusyRefusesStory"]
old = '''
YouSwitchOrDeleteASwipe(g) ==
  /\ "story" \in Env
  /\ g \in exists
  /\ holder[g].kind = "none"                         \* `require_idle`'''
new = '''
YouSwitchOrDeleteASwipe(g) ==
  /\ "story" \in Env
  /\ g \in exists'''

[[mutant]]
name = "job-writer-without-id-check"
code = "JobWriter::hold checks only that the Game is busy, not the job id"
config = "jobs"
breaks = ["StoppedJobWritesNothing"]
old = '''Own(j) == holder[job[j].g].job = j'''
new = '''Own(j) == TRUE'''

[[mutant]]
name = "stop-keeps-failure-line"
code = "GameWriter::stop does not clear the failure line"
config = "jobs"
breaks = ["StopNoFailureLine"]
old = '''
  /\ holder' = [holder EXCEPT ![g] = Idle]
  /\ failLine' = [failLine EXCEPT ![g] = 0]
  /\ optFail' = [optFail EXCEPT ![g] = 0]
  /\ CutOf(g)
  /\ UNCHANGED <<exists, fresh, active, last,'''
new = '''
  /\ holder' = [holder EXCEPT ![g] = Idle]
  /\ optFail' = [optFail EXCEPT ![g] = 0]
  /\ CutOf(g)
  /\ UNCHANGED <<failLine, exists, fresh, active, last,'''

[[mutant]]
name = "stop-keeps-options-failure"
code = "GameWriter::stop does not clear the Options failure of the dock"
config = "jobs"
breaks = ["StopClearsOptionsFailure"]
old = '''
  /\ failLine' = [failLine EXCEPT ![g] = 0]
  /\ optFail' = [optFail EXCEPT ![g] = 0]
  /\ CutOf(g)
  /\ UNCHANGED <<exists, fresh, active, last,'''
new = '''
  /\ failLine' = [failLine EXCEPT ![g] = 0]
  /\ CutOf(g)
  /\ UNCHANGED <<optFail, exists, fresh, active, last,'''

[[mutant]]
name = "stop-keeps-the-run"
code = "GameWriter::stop removes the Job of a run, but keeps the run holder"
config = "runs"
breaks = ["StopLeavesIdle"]
old = '''
  /\ "stop" \in Env
  /\ g \in exists
  /\ holder' = [holder EXCEPT ![g] = Idle]'''
new = '''
  /\ "stop" \in Env
  /\ g \in exists
  /\ holder' = [holder EXCEPT ![g] = IF @.kind = "run" THEN [@ EXCEPT !.job = NoJob] ELSE Idle]'''

[[mutant]]
name = "reset-keeps-the-holder"
code = "GameWriter::replace deletes the old Game but does not remove its holder"
config = "jobs"
breaks = ["StoppedJobWritesNothing"]
old = '''
       /\ exists' = (exists \cup {n}) \ {g}
       /\ holder' = [holder EXCEPT ![g] = Idle]
       /\ CutOf(g)'''
new = '''
       /\ exists' = (exists \cup {n}) \ {g}
       /\ UNCHANGED <<holder, cut, cutRuns>>'''

[[mutant]]
name = "job-drop-without-id-check"
code = "Drop for JobWriter removes the holder with no job id check"
config = "jobs"
breaks = ["NextJobKeepsHolder"]
old = '''holder' = IF holder[g].job = j'''
new = '''holder' = IF TRUE'''

[[mutant]]
name = "job-drop-removes-the-run"
code = "Drop for JobWriter removes the holder of a run too"
config = "runs"
breaks = ["RunHoldsItsGame"]
old = '''IF @.kind = "run" THEN [@ EXCEPT !.job = NoJob] ELSE Idle]'''
new = '''Idle]'''

[[mutant]]
name = "accept-without-run-check"
code = "GameWriter::accept_for_autoplay checks only that a run holds the Game, not its run id"
config = "two-runs"
breaks = ["StoppedRunStartsNoJob"]
without = ["RunHoldsItsGame"]
old = '''
         ours == holder[g].kind = "run" /\ holder[g].run = r
         d == '''
new = '''
         ours == holder[g].kind = "run"
         d == '''

[[mutant]]
name = "run-end-without-run-check"
code = "GameWriter::end_autoplay removes the holder with no run id check"
config = "two-runs"
breaks = ["RunHoldsItsGame"]
old = '''h2 == IF ours THEN [holder EXCEPT ![g] = Idle] ELSE holder'''
new = '''h2 == [holder EXCEPT ![g] = Idle]'''

[[mutant]]
name = "run-end-keeps-the-holder"
code = "Drop for AutoplayRun does not call GameWriter::end_autoplay"
config = "runs"
breaks = ["RunEndsIdle"]
old = '''h2 == IF ours THEN [holder EXCEPT ![g] = Idle] ELSE holder'''
new = '''h2 == holder'''

[[mutant]]
name = "config-write-during-a-run"
code = "GameWriter::save_config refuses nothing"
config = "runs"
breaks = ["RunRefusesConfig"]
old = '''
  /\ holder[g].kind # "run"
'''
new = '''
'''

[[mutant]]
name = "budget-checked-too-late"
code = "AutoplayAccept::Finished only at done > budget"
config = "runs"
breaks = ["BudgetBound"]
old = '''
       [] ours /\ readOk /\ d >= Budget ->            \* `AutoplayAccept::Finished`'''
new = '''
       [] ours /\ readOk /\ d = Budget ->
            /\ j \in JobIds
            /\ holder' = [holder EXCEPT ![g] = [@ EXCEPT !.job = j, !.done = d]]
            /\ job' = [job EXCEPT ![j] =
                         [NoJobState EXCEPT !.g = g, !.run = r, !.pc = "start", !.opt = "after",
                            !.kind = IF last[g] = "input" THEN "continue" ELSE "impersonate"]]
            /\ nextJob' = nextJob + 1
            /\ run' = [run EXCEPT ![r].pc = "job", ![r].done = d, ![r].job = j]
            /\ UNCHANGED <<failLine, badAccept>>
       [] ours /\ readOk /\ d > Budget ->'''

[[mutant]]
name = "moved-job-ends-as-failure"
code = "the run loop maps JobEnd::EntryMoved to RunEnd::JobFailed"
config = "two-runs"
breaks = ["RunEndReasons"]
old = '''                              [] OTHER -> "stopped"]'''
new = '''                              [] OTHER -> "jobFailed"]'''

[[mutant]]
name = "not-accepted-without-failure-line"
code = "GameWriter::accept_for_autoplay ends the run with no failure line"
config = "runs"
breaks = ["RunFailureLineStays"]
old = '''
            /\ failLine' = [failLine EXCEPT ![g] = -1]
            /\ holder' = [holder EXCEPT ![g] = Idle]'''
new = '''
            /\ UNCHANGED failLine
            /\ holder' = [holder EXCEPT ![g] = Idle]'''

[[mutant]]
name = "delete-check-inside-the-hold"
code = "the fix: GameWriter::delete refuses the active Game inside its hold"
config = "delete-race"
fix = true
breaks = []
old = '''
  /\ g \in pending.delete
  /\ exists' = exists \ {g}
  /\ holder' = [holder EXCEPT ![g] = Idle]
  /\ CutOf(g)
  /\ deletedActive' = (deletedActive \/ (active = g /\ g \in exists))'''
new = '''
  /\ g \in pending.delete
  /\ exists' = IF active = g THEN exists ELSE exists \ {g}
  /\ holder' = IF active = g THEN holder ELSE [holder EXCEPT ![g] = Idle]
  /\ IF active = g THEN UNCHANGED <<cut, cutRuns>> ELSE CutOf(g)
  /\ deletedActive' = (deletedActive \/ (active = g /\ g \in exists /\ g \notin exists'))'''
