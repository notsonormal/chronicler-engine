\* Two Games and no Job: a delete, a switch, a create and a reset, each under the outer
\* lock of ActiveGame. Only this config checks DeleteNotActive. With ActiveExists it shows
\* that no order of these requests leaves the pointer on a deleted Game.
SPECIFICATION Spec
CONSTANTS
  Games0 = {1, 2}
  NewGames = {3, 4}
  Active0 = 1
  MaxJobs = 0
  MaxRuns = 0
  Budget = 1
  PlainKinds = {"action"}
  Env = {"reset", "create", "delete", "switch"}
INVARIANTS
  TypeOK
  OneJob
  BusyRefusesStory
  StoppedJobWritesNothing
  StopNoFailureLine
  StopClearsOptionsFailure
  NextJobKeepsHolder
  RunHoldsItsGame
  StoppedRunStartsNoJob
  RunRefusesConfig
  RunEndReasons
  BudgetBound
  RunFailureLineStays
  RunEndsIdle
  DeleteNotActive
  ActiveExists
PROPERTY
  StopLeavesIdle
  SwipeClearsFailures
