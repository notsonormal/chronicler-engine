# The coverage record of the verify-gate skill.
#
# Each listed function carries a `hash` of its text, recorded when an agent last confirmed that
# model/VerifyGate.tla describes it. `build.py` hashes each function as it is on disk and warns
# when the hash differs, when it is missing, or when the function is not found (see
# scripts/verify_coverage.py). A plain string entry has no hash yet, so it warns. Write the
# hashes with `python scripts/verify_coverage.py record`, only after the TLA+ model follows the
# code (SKILL.md, "Update the model after a code change"). Do not edit a hash by hand.
#
# `sync_commit` is a note for the maintain pass only: the commit at which the TLA+ model was
# last confirmed. The pass reads `git diff <sync_commit>` to see the old code. The warning never
# reads it. Move it forward only to a commit that holds the change.

