\* Scope: one Game, up to two Jobs (Action or Options), one Autoplay run of one cycle, Stop, and the story writes.
SPECIFICATION Spec
CONSTANTS
  Games0 = {1}
  NewGames = {}
  Active0 = 1
  MaxJobs = 2
  MaxRuns = 1
  Budget = 1
  PlainKinds = {"action", "options"}
  Env = {"plain", "run", "stop", "story"}
INVARIANTS
  TypeOK
  OneJob
  BusyRefusesStory
  StoppedJobWritesNothing
  StopNoFailureLine
  StopClearsOptionsFailure
  NextJobKeepsHolder
  RunHoldsItsGame
  StoppedRunStartsNoJob
  RunRefusesConfig
  RunEndReasons
  BudgetBound
  RunFailureLineStays
  RunEndsIdle
  DeleteNotActive
PROPERTY
  StopLeavesIdle
  SwipeClearsFailures
