[package]
name = "chronicler_engine"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dotenv = "0.15.0"
reqwest = { version = "0.13.2", features = [
  "blocking",
  "json",
  "gzip",
  "brotli",
] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.128"
image = "0.25.10"
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower-http = { version = "0.5", features = ["fs"] }
http = "1"
futures-util = "0.3"
thiserror = "2.0.18"
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.34", features = ["bundled"] }
uuid = { version = "1.16", features = ["v4", "serde"] }
tokio-stream = "0.1"
async-stream = "0.3"
tracing-appender = "0.2"
tracing = "0.1"
parking_lot = "0.12"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-serde = "0.1"
askama = "0.15"
regex = "1.11"
pulldown-cmark = "0.13"
once_cell = "1.20"
harper-core = "0.25.0"

[dev-dependencies]
playwright-rs = "0.9"
reqwest = { version = "0.13", features = ["json", "form"] }

[target.'cfg(not(target_os = "windows"))'.dev-dependencies]
libc = "0.2"
tower = "0.5"
dotenv = "0.15.0"
arch-lint = "0.4"
syn = { version = "2.0", features = ["full", "visit"] }
quote = "1.0"
tracing-test = "0.2"
walkdir = "2.5"
proptest = "1.6"
chrono = "0.4"
tempfile = "3.20"
urlencoding = "2.1"

[features]
default = ["testing"]
diagnostics = []
testing = []
[[test]]
name = "architecture"
path = "tests/infrastructure/architecture.rs"
required-features = ["testing"]

[[test]]
name = "guardrails"
path = "tests/infrastructure/guardrails/mod.rs"
required-features = ["testing"]

[[test]]
name = "invariant_contract"
path = "tests/infrastructure/invariant_contract.rs"
required-features = ["testing"]

# Integration test harness - temporary home for HTTP-observable tests while ticket 02 moves them to `tests/http/`.
# Once ticket 02/03 complete, this entry will be removed.
[[test]]
name = "storage"
path = "tests/storage/mod.rs"
required-features = ["testing"]

[[test]]
name = "bootstrap"
path = "tests/bootstrap/mod.rs"
required-features = ["testing"]

[[test]]
name = "http"
path = "tests/http/mod.rs"
required-features = ["testing"]

[[test]]
name = "browser"
path = "tests/browser/mod.rs"
required-features = ["testing"]

[[test]]
name = "llm"
path = "tests/llm/mod.rs"
required-features = ["testing"]
