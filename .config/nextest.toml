[profile.default]
test-threads = 4
retries = 1
slow-timeout = { period = "60s", terminate-after = 1, on-timeout = "fail" }

# arch_lint_check parses the whole source tree single-threaded; under suite
# load on a 2-core box a healthy run can exceed the 60s default. Its runtime is
# bounded by the suite's own duration (~141s), so 180s covers the worst
# legitimate case while still aborting a pathological run.
[[profile.default.overrides]]
filter = 'binary(architecture)'
slow-timeout = { period = "180s", terminate-after = 1, on-timeout = "fail" }

# Each browser test spawns an engine server + Chromium; at 4-way parallelism
# startup can exceed the 30s server-ready timeout and the whole binary flakes
# (retries cannot help while the contention persists). Run each browser test
# alone so spawns never oversubscribe.
[[profile.default.overrides]]
filter = 'binary(browser)'
threads-required = "num-test-threads"

[profile.llm]
inherits = "default"
slow-timeout = { period = "300s", terminate-after = 1, on-timeout = "fail" }
