[profile.default]
# Retries stay 0: a flake must fail the gate instead of passing silently on a
# retry. The browser tier runs as its own gate step, so the contention that
# motivated retry-masking is gone.
test-threads = 3
slow-timeout = { period = "60s", terminate-after = 1, on-timeout = "fail" }

# arch_lint_check parses the whole source tree single-threaded; under suite
# load on a 2-core box a healthy run can exceed the 60s default. Its runtime is
# bounded by the suite's own duration (~141s), so 180s covers the worst
# legitimate case while still aborting a pathological run.
[[profile.default.overrides]]
filter = 'binary(architecture)'
slow-timeout = { period = "180s", terminate-after = 1, on-timeout = "fail" }

# Browser tests launch Playwright/Chromium instances. Concurrency is
# test-threads / threads-required, so 3 / 1 runs three at once, matching the
# 3-CPU container quota. Measured 2026-10-02: 3-way ~66s vs 2-way ~75s with no
# failures; 4-way gained nothing more and pushed memory to the 8 GiB cap. Change
# test-threads and threads-required together or the browser tier silently drops
# to one test at a time.
[[profile.default.overrides]]
filter = 'binary(browser)'
threads-required = 1

[profile.llm]
inherits = "default"
slow-timeout = { period = "300s", terminate-after = 1, on-timeout = "fail" }
