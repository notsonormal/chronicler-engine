\* Two Games and no Job: a delete, a switch and a reset of the active Game. Only this
\* config checks DeleteNotActive, because it breaks today (see SKILL.md, Known findings).
SPECIFICATION Spec
CONSTANTS
  Games0 = {1, 2}
  NewGames = {3}
  Active0 = 1
  MaxJobs = 0
  MaxRuns = 0
  Budget = 1
  PlainKinds = {"action"}
  Env = {"reset", "delete", "switch"}
INVARIANTS
  TypeOK
  OneJob
  BusyRefusesStory
  StoppedJobWritesNothing
  StopNoFailureLine
  StopClearsOptionsFailure
  NextJobKeepsHolder
  RunHoldsItsGame
  StoppedRunStartsNoJob
  RunRefusesConfig
  RunEndReasons
  BudgetBound
  RunFailureLineStays
  RunEndsIdle
  DeleteNotActive
  ActiveExists
PROPERTY
  StopLeavesIdle
