ed</text></g><g class="pele-edge-label" data-id="edge16"><rect x="626.67" y="1029.5" width="101.38" height="21" rx="3" fill="var(--_bg)"/><text x="677.36" y="1044.9" text-anchor="middle">you press Stop</text></g></g><g class="pele-nodes"><g class="pele-node pele-state tan" data-id="s0" transform="translate(591.13,186)"><rect x="-63.14" y="-22" width="126.27" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Not accepted</text></g><g class="pele-node pele-state orange" data-id="s8" transform="translate(677.36,1109)"><rect x="-113.83" y="-31" width="227.66" height="62" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.9">Cut off: runs on, but its next</tspan><tspan x="0" y="16.1">write is refused</tspan></text></g><g class="pele-node pele-state teal" data-id="s9" transform="translate(677.36,1231)"><rect x="-112.49" y="-22" width="224.98" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Ended: a write was refused</text></g><g class="pele-node pele-state teal" data-id="s10" transform="translate(423.94,1231)"><rect x="-100.93" y="-22" width="201.86" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Ended with a failure line</text></g><g class="pele-node pele-state teal" data-id="s11" transform="translate(869.84,1231)"><rect x="-39.13" y="-22" width="78.26" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Ended</text></g><g class="pele-node pele-state-start" data-id="root_start" transform="translate(591.13,113)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state tan" data-id="lg0" transform="translate(63.57,82)"><rect x="-39.57" y="-22" width="79.14" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text