<div class="action-area" id="action-area"><div id="action-preview" class="action-preview"></div><form id="command-form" hx-post="/action/check" hx-target="#action-preview" hx-swap="innerHTML" hx-sync="this:drop" hx-on::before-request="onCommandBeforeRequest()" hx-on::after-request="onCommandAfterRequest()"><input type="text" name="command" placeholder="Enter command..." required minlength="1" autocomplete="off" /><button type="submit" id="submit-btn" ><span class="btn-icon">&#9654;</span> Send</button></form><div class="status ready" id="status-display" hx-get="/status/generating" hx-trigger="load, every 5s" hx-swap="innerHTML" hx-on::after-swap="onStatusPoll(this)"><span class="status ready">Ready</span></div></div>
